<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>森博嗣 作品相関マップ</title>
<style>
:root{--bg:#fafaf7;--fg:#222;--sub:#666;--card:#fff;--line:#ddd;--grid:#e6e6e0;
--g:#2f6f4f;--gl:#e1f1e8;--w:#2a5d9f;--wl:#e2ecfa;--ww:#a4572b;--wwl:#fbeadf;--sm:#8b3a3a;--sml:#fde8e8;--v:#4a2d8a;--vl:#ece8fa;--sh:#2c5a3a;--shl:#e8f5ec;--x:#2a4060;--xl:#e8eef5;--xx:#1a5050;--xxl:#e8f5f5;--mr:#7a4520;--mrl:#f5ece8;--sc:#1a2a58;--scl:#e8ecf5;--vs:#3a5820;--vsl:#eef5e8;--mizu:#1a4a68;--mizul:#e8f0f5;--z:#383840;--zl:#f0f0f2;--short:#581a4a;--shortl:#f5e8f2;--etc:#2a1a58;--etcl:#ece8f5;--cream:#5c3a10;--creaml:#f5f0e8}
@media(prefers-color-scheme:dark){:root{--bg:#16181a;--fg:#e8e8e4;--sub:#9a9a95;--card:#1f2224;--line:#33383b;--grid:#2a2e31;
--g:#6fcf9a;--gl:#1f3a2c;--w:#7fb1f0;--wl:#1f3047;--ww:#e8a074;--wwl:#472f20;--sm:#d07070;--sml:#3a2020;--v:#9a78d4;--vl:#2a1a3a;--sh:#70c898;--shl:#1a2a20;--x:#7898c4;--xl:#1a2230;--xx:#60c4c4;--xxl:#1a2a2a;--mr:#c87040;--mrl:#3a2010;--sc:#6878c4;--scl:#1a1e2a;--vs:#90c450;--vsl:#202a10;--mizu:#50a0c8;--mizul:#1a2828;--z:#9898a0;--zl:#202022;--short:#c060a0;--shortl:#2a1a24;--etc:#7070c8;--etcl:#1a1a2a;--cream:#c0901a;--creaml:#2a1c08}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.6 -apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
main{max-width:1180px;margin:0 auto;padding:16px 16px 50px}
h1{font-size:20px;margin:2px 2px 4px}
.lead{font-size:13.5px;color:var(--sub);margin:4px 2px 10px;max-width:820px}
.legend{display:flex;flex-wrap:wrap;gap:14px;align-items:center;font-size:12px;color:var(--sub);margin:2px 2px 8px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.lg-dot{width:11px;height:11px;border-radius:50%;background:var(--sub)}
.lg-line{width:22px;height:0;border-top:2px solid var(--sub)}
.lg-dash{width:22px;height:0;border-top:2px dashed var(--sub)}
.wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card);padding:6px 2px}
svg{display:block;min-width:900px;width:100%;height:auto}
.srlabel{cursor:pointer;font-size:11.5px;font-weight:600}
.srlabel:hover{text-decoration:underline}
.dot{cursor:pointer}
.dot:hover{stroke:var(--fg);stroke-width:1.5}
.srow:hover .lane{opacity:1}
.edgelbl{font-size:10px;fill:var(--sub)}
.foot{font-size:12px;color:var(--sub);margin:14px 2px;max-width:820px}
.foot a{color:var(--sub)}
</style>
</head>
<body>
<main>
<h1>森博嗣 作品相関マップ</h1>
<p class="lead">横軸は刊行年月、縦軸は各シリーズ。○が各巻で、線は刊行の順番（○→○）を表します。破線は、作者コメントなどから明らかな派生・連続の関係です。シリーズ名か○をクリックすると各巻ガイドへ移動します（ネタバレなし）。</p>
<div class="legend">
 <span><i class="lg-dot"></i>各巻</span>
 <span><i class="lg-line"></i>刊行順</span>
 <span><i class="lg-dash"></i>派生・続編の関係</span>
 <span>○にカーソルを合わせると作品名</span>
</div>
<div class="wrap"><div id="chart"></div></div>
<p class="foot">刊行年月は各巻の初版（文庫化のみの『ω城の惨劇』は文庫刊行年）に基づきます。派生関係は、作者公式サイト（浮遊工作室）のコメントや各シリーズの位置づけから、明確なものだけを結んでいます。→ <a href="guide.html">各巻ガイドを開く</a></p>
</main>
<script>
// [key, 短縮ラベル, カラー変数, [[巻, タイトル, 'YYYY/M'], ...]]
const SERIES=[
 ['sm','S&M','--sm',[[1,'すべてがＦになる','1996/4'],[2,'冷たい密室と博士たち','1996/7'],[3,'笑わない数学者','1996/9'],[4,'詩的私的ジャック','1997/1'],[5,'封印再度','1997/4'],[6,'幻惑の死と使途','1997/10'],[7,'夏のレプリカ','1998/1'],[8,'今はもうない','1998/4'],[9,'数奇にして模型','1998/7'],[10,'有限と微小のパン','1998/10']]],
 ['v','V','--v',[[1,'黒猫の三角','1999/5'],[2,'人形式モナリザ','1999/9'],[3,'月は幽咽のデバイス','2000/1'],[4,'夢・出逢い・魔性','2000/5'],[5,'魔剣天翔','2000/9'],[6,'恋恋蓮歩の演習','2001/5'],[7,'六人の超音波科学者','2001/9'],[8,'捩れ屋敷の利鈍','2002/1'],[9,'朽ちる散る落ちる','2002/5'],[10,'赤緑黒白','2002/9']]],
 ['sh','四季','--sh',[[1,'四季 春','2003/9'],[2,'四季 夏','2003/11'],[3,'四季 秋','2004/1'],[4,'四季 冬','2004/3']]],
 ['mr','百年','--mr',[[1,'女王の百年密室','2000/6'],[2,'迷宮百年の睡魔','2003/6'],[3,'赤目姫の潮解','2013/7']]],
 ['g','G','--g',[[1,'φは壊れたね','2004/9'],[2,'θは遊んでくれたよ','2005/5'],[3,'τになるまで待って','2005/9'],[4,'εに誓って','2006/5'],[5,'λに歯がない','2006/9'],[6,'ηなのに夢のよう','2007/1'],[7,'目薬αで殺菌します','2008/9'],[8,'ジグβは神ですか','2012/11'],[9,'キウイγは時計仕掛け','2013/11'],[10,'χの悲劇','2016/5'],[11,'ψの悲劇','2018/5'],[12,'ω城の惨劇(文庫)','2025/10']]],
 ['sc','スカイ・クロラ','--sc',[[5,'スカイ・クロラ','2001/6'],[1,'ナ・バ・テア','2004/6'],[2,'ダウン・ツ・ヘヴン','2005/6'],[3,'フラッタ・リンツ・ライフ','2006/6'],[4,'クレィドゥ・ザ・スカイ','2007/6'],[6,'スカイ・イクリプス','2008/6']]],
 ['mizu','水柿','--mizu',[[1,'水柿助教授の日常','2000/12'],[2,'水柿助教授の逡巡','2004/12'],[3,'水柿助教授の解脱','2008/4']]],
 ['z','Z','--z',[[1,'ＺＯＫＵ','2003/10'],[2,'ＺＯＫＵＤＡＭ','2007/7'],[3,'ＺＯＫＵＲＡＮＧＥＲ','2009/4']]],
 ['vs','ヴォイド・シェイパ','--vs',[[1,'ヴォイド・シェイパ','2011/4'],[2,'ブラッド・スクーパ','2012/4'],[3,'スカル・ブレーカ','2013/4'],[4,'フォグ・ハイダ','2014/4'],[5,'マインド・クァンチャ','2015/4']]],
 ['x','X','--x',[[1,'イナイ×イナイ','2007/5'],[2,'キラレ×キラレ','2007/9'],[3,'タカイ×タカイ','2008/1'],[4,'ムカシ×ムカシ','2014/6'],[5,'サイタ×サイタ','2014/11'],[6,'ダマシ×ダマシ','2017/5']]],
 ['w','W','--w',[[1,'彼女は一人で歩くのか？','2015/10'],[2,'魔法の色を知っているか？','2016/1'],[3,'風は青海を渡るのか？','2016/6'],[4,'デボラ、眠っているのか？','2016/10'],[5,'私たちは生きているのか？','2017/2'],[6,'青白く輝く月を見たか？','2017/6'],[7,'ペガサスの解は虚栄か？','2017/10'],[8,'血か、死か、無か？','2018/2'],[9,'天空の矢はどこへ？','2018/6'],[10,'人間のように泣いたのか？','2018/10']]],
 ['ww','WW','--ww',[[1,'それでもデミアンは一人なのか？','2019/6'],[2,'神はいつ問われるのか？','2019/10'],[3,'キャサリンはどのように子供を産んだのか？','2020/2'],[4,'幽霊を創出したのは誰か？','2020/6'],[5,'君たちは絶滅危惧種なのか？','2021/4'],[6,'リアルの私はどこにいる？','2022/4'],[7,'君が見たのは誰の夢？','2023/4'],[8,'何故エリーズは語らなかったのか？','2024/4']]],
 ['xx','XX','--xx',[[1,'馬鹿と嘘の弓','2020/10'],[2,'歌の終わりは海','2021/10'],[3,'情景の殺人者','2023/10']]],
 ['short','短編集','--short',[[3,'まどろみ消去','1997/7'],[4,'地球儀のスライス','1999/1'],[5,'今夜はパラシュート博物館へ','2001/1'],[6,'虚空の逆マトリクス','2003/1'],[7,'レタス・フライ','2006/1'],[1,'どちらかが魔女','2008/8'],[2,'僕は秋子に借りがある','2008/8']]],
 ['etc','シリーズ外','--etc',[[1,'そして二人だけになった','1999/6'],[2,'墜ちていく僕たち','2001/6'],[3,'奥様はネットワーカ','2002/7'],[4,'探偵伯爵と僕','2004/4'],[5,'どきどきフェノメノン','2005/4'],[6,'カクレカラクリ','2006/8'],[7,'少し変わった子あります','2006/8'],[8,'ゾラ・一撃・さようなら','2007/8'],[10,'もえない','2007/12'],[11,'銀河不動産の超越','2008/5'],[12,'トーマの心臓','2009/7'],[13,'喜嶋先生の静かな世界','2010/10'],[14,'相田家のグッドバイ','2012/2'],[15,'実験的経験','2012/5'],[16,'神様が殺してくれる','2013/6'],[9,'暗闘・キッス・それだけで','2015/1'],[17,'イデアの影','2015/11']]],
 ['cream','クリーム','--cream',[[1,'つぶやきのクリーム','2011/9'],[2,'つぼやきのテリーヌ','2013/12'],[3,'つぼねのカトリーヌ','2014/12'],[4,'ツンドラモンスーン','2015/12'],[5,'つぼみ茸ムース','2016/12'],[6,'つぶさにミルフィーユ','2017/12'],[7,'月夜のサラサーテ','2018/12'],[8,'つんつんブラザーズ','2019/12'],[9,'ツベルクリンムーチョ','2020/12'],[10,'追懐のコヨーテ','2021/12'],[11,'積み木シンドローム','2022/12'],[12,'妻のオンパレード','2023/12'],[13,'つむじ風のスープ','2024/12'],[14,'つくねもハンバーグ','2025/12']]]
];
// 派生・続編の関係 [起点key, 終点key, ラベル]
const EDGES=[
 ['sm','v','同時期に並行'],
 ['sm','sh','真賀田四季の物語'],
 ['sm','g','過去作の人物が集結'],
 ['mr','w','百年シリーズが前提'],
 ['sc','vs','スカイ・クロラ後に構想'],
 ['x','xx','Xの後続'],
 ['w','ww','Wの続編']
];

const cssv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const parseY=s=>{const m=s.match(/(\d{4})\/(\d{1,2})/);return +m[1]+(+m[2]-1)/12;};

const Y0=1996, Y1=2026.5;
const padL=134, padR=26, padT=40, rowH=34, botH=22, dotR=5;
const W=1180, H=padT+SERIES.length*rowH+botH;
const plotL=padL, plotR=W-padR;
const x=y=>plotL+(y-Y0)/(Y1-Y0)*(plotR-plotL);
const rowY=i=>padT+i*rowH+rowH/2;
const idx={}; SERIES.forEach((s,i)=>idx[s[0]]=i);

function esc(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

let svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="森博嗣 作品相関マップ">`;

// 年グリッド＋目盛
for(let yr=1996; yr<=2025; yr++){
 const gx=x(yr);
 const major=(yr%5===0)||yr===1996;
 svg+=`<line x1="${gx.toFixed(1)}" y1="${padT-8}" x2="${gx.toFixed(1)}" y2="${H-botH}" stroke="var(--grid)" stroke-width="${major?1:0.5}"/>`;
 if(major) svg+=`<text x="${gx.toFixed(1)}" y="${padT-14}" text-anchor="middle" font-size="11" fill="var(--sub)">${yr}</text>`;
}

// 派生エッジ（破線・曲線）※レーンの背面
EDGES.forEach(([a,b,lbl])=>{
 const sa=SERIES[idx[a]], sb=SERIES[idx[b]];
 const bFirst=sb[3].reduce((m,v)=>parseY(v[2])<parseY(m[2])?v:m);
 const bx=x(parseY(bFirst[2])), by=rowY(idx[b]);
 // 起点: 終点の刊行時以前で最も新しい巻（なければ最古）
 const cand=sa[3].filter(v=>parseY(v[2])<=parseY(bFirst[2]));
 const aV=(cand.length?cand:sa[3]).reduce((m,v)=>parseY(v[2])>parseY(m[2])?v:m);
 const ax=x(parseY(aV[2])), ay=rowY(idx[a]);
 const mx=(ax+bx)/2, my=(ay+by)/2;
 const col=cssv(sa[2]);
 const cx=mx + (by>ay?18:-18);
 svg+=`<path d="M${ax.toFixed(1)},${ay.toFixed(1)} Q${cx.toFixed(1)},${my.toFixed(1)} ${bx.toFixed(1)},${by.toFixed(1)}" fill="none" stroke="${col}" stroke-width="1.6" stroke-dasharray="4 3" opacity="0.6"/>`;
 svg+=`<circle cx="${bx.toFixed(1)}" cy="${by.toFixed(1)}" r="2.6" fill="${col}" opacity="0.8"/>`;
 svg+=`<text class="edgelbl" x="${mx.toFixed(1)}" y="${(my-3).toFixed(1)}" text-anchor="middle">${esc(lbl)}</text>`;
});

// 各シリーズのレーン・線・ドット・ラベル
SERIES.forEach((s,i)=>{
 const [key,label,cv,vols]=s;
 const col=cssv(cv);
 const y=rowY(i);
 svg+=`<g class="srow">`;
 // レーン背景
 svg+=`<line class="lane" x1="${plotL}" y1="${y}" x2="${plotR}" y2="${y}" stroke="var(--grid)" stroke-width="1" opacity="0.55"/>`;
 // ラベル
 svg+=`<text class="srlabel" x="${plotL-10}" y="${y+4}" text-anchor="end" fill="${col}" onclick="location.href='guide.html#${key}'">${esc(label)}</text>`;
 // 刊行順に並べた点を線で結ぶ
 const sorted=vols.slice().sort((p,q)=>parseY(p[2])-parseY(q[2]));
 let d='';
 sorted.forEach((v,j)=>{const px=x(parseY(v[2]));d+=(j?'L':'M')+px.toFixed(1)+','+y;});
 svg+=`<path d="${d}" fill="none" stroke="${col}" stroke-width="2" opacity="0.85"/>`;
 // ドット
 sorted.forEach(v=>{
  const px=x(parseY(v[2]));
  svg+=`<circle class="dot" cx="${px.toFixed(1)}" cy="${y}" r="${dotR}" fill="${col}" stroke="var(--card)" stroke-width="1" onclick="location.href='guide.html#${key}'"><title>${esc(label)}${v[0]?' '+v[0]:''}『${esc(v[1])}』 ${esc(v[2])}</title></circle>`;
 });
 svg+=`</g>`;
});

svg+=`</svg>`;
document.getElementById('chart').innerHTML=svg;
</script>
</body>
</html>
