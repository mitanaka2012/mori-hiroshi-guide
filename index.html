<style>

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.65 -apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
main{max-width:520px;margin:0 auto;padding:14px 12px 50px}
h1{font-size:19px;margin:4px 2px}
.tabs{display:flex;gap:6px;margin:10px 0;position:sticky;top:0;background:var(--bg);padding:6px 0;z-index:5}
.tabs button{flex:1;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:10px;padding:7px 4px;font-size:13px;cursor:pointer}
.tabs button.on{background:var(--c);color:#fff;border-color:var(--c)}
.mode-tabs{display:flex;gap:6px;margin:0 0 6px}
.mode-tabs button{flex:1;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:8px;padding:6px 4px;font-size:12.5px;cursor:pointer}

.step:not(:last-child)::after{content:"";position:absolute;top:12px;left:50%;width:100%;height:2px;background:var(--c);opacity:.45}
.step span{font-size:10.5px;color:var(--sub);display:block;line-height:1.3}

.head{display:flex;gap:10px;align-items:flex-start}
.num{flex:0 0 auto;width:30px;height:30px;border-radius:8px;background:var(--c);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center}

.chip{display:inline-block;font-size:11px;padding:0 8px;border-radius:99px;background:var(--cl);color:var(--c);margin:4px 4px 0 0;border:1px solid var(--c)}
.sum{margin:6px 0 4px;font-size:13.5px}
.who{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.p{font-size:12px;background:var(--cl);border-radius:8px;padding:2px 8px;line-height:1.4}
.p em{display:block;font-style:normal;color:var(--sub);font-size:10.5px}
.lbl{font-size:11px;color:var(--sub);margin-top:8px}
.sp{display:none;margin-top:8px;padding:6px 10px;border:1px dashed var(--spoil);border-radius:8px;font-size:12.5px;color:var(--spoil)}
body.show .sp{display:block}
.ac-box{margin-top:8px;padding:10px 12px;background:var(--cl);border-left:3px solid var(--c);border-radius:6px;font-size:13.5px;line-height:1.75;white-space:pre-wrap;color:var(--fg)}
.ac-none{color:var(--sub);font-size:12px;margin-top:8px;font-style:italic;padding:6px 0}
.foot{font-size:12px;color:var(--sub);margin:16px 2px}
</style>

<main>
<h1>森博嗣 各巻ガイド</h1>
<div class="tabs" id="tabs"></div>

<label class="opt" id="spOpt"><input type="checkbox" id="sp"> ネタバレを表示する</label>

<p class="foot">確認できた範囲(講談社の紹介文、作者公式サイト、百科事典、読者レビュー)での整理です。「読者レビューより」とある箇所は、レビュー記事に基づく補足です。資料で分からなかった巻(Gの第10・11作の細部、Wの第6・7・10作の脇役など)は、人物を絞って載せています。WWシリーズの第4〜8巻は、作者公式サイトのコメントに基づく紹介のみです。作者コメントは浮遊工作室から取得しています（再取得は extract_from_debug.py を実行）。</p>

<script>
/* __COMMENTS_START__ */
const COMMENTS={
 sm:["文庫は、43刷からカバーが新しくなりました。\nこの作品が出版された最初のもので、95/12に書きました。もともとは、犀川・萌絵シリーズの５連作として書き上げた作品群の第４作目にあたります。つまり、「詩的私的ジャック」のあとに書いたのですが、出版社の意向で最初に刊行されました。このため、当初の原稿を変更して、「冷たい密室と博士たち」よりもまえに起こった事件となり、西之園萌絵が大学１年生になってしまったわけです。最初の設定より過去にバックしちゃったんですね。\n作品に関しては、大した入れ込みはありませんが、トリックが少し際疾くて変わっているかもしれませんね。巷では、これをＳＦミステリィと勘違いしている人もいるようです。まあ、ＳＦっぽいのは認めますけど。森はＳＦというものを１冊も読んだことがないので、的確な判断はできませんが、結局は、読者がどう感じようが自由でしょう。人間いろいろなタイプがいるということです。しかし、この小説に登場するテクノロジィは、1994年くらいのレベルで、けっしてＳＦではありません。今はもっと進んでいるはずです。\nこの作品で、割に活躍した儀同世津子は、５作目「封印再度」にも再登場します。今年末には文庫化される予定ですが・・、もちろん、どうなるかわかりません。","文庫は、40刷からカバーが新しくなりました。\n95/9、夏休みに書いた正真正銘の処女作です。大学の中を舞台にして周囲の人たちをモデルにしたので皆さんから詮索されました。犀川も西之園もすべて実在の友人の名前を借用しています。構想３日、執筆２週間です。他の作品はだいたい執筆に３週間前後かかっていますので、この作品だけ速かったということです。\n最も描きたかったのは、のうてんきな被害者です。また、この５連作では、犀川と萌絵の成長がテーマとなっていますので、「すべてがＦになる」と比べて人物が少し変わったなんて言われると、そのとおりです、というしかありません（以後、もっと変化します）。\nＵＮＩＸの侵入に関しては、詳しく書かなかったし、適当です。そのことで、いろいろな指摘をいただきました。でも、あんまり詳しく書くと問題でしょう？\nそうそう、船見君という学生の姓を使わせてもらったんですが、彼のお母さんが偶然にも船見真智子さんで、漢字まで同じだそうです。なかなか神様も洒落てますね。なお、極地研というのは、架空のセンターで、実際のＮ大学には存在しません。\nキャラクタ設定がここで行われている、という意味しかない作品です。意外にもマニアうけしました。","文庫は、2011年秋より順次カバーが新しくなりました。\n犀川、萌絵シリーズの第3話で、95/10に書きました。いつも英語のタイトルをさきに決めますが、日本語のタイトルではめいっぱい悩みます。これもそうでした。この英語タイトル、どう訳したら良いでしょう？\nお話は最初の「すべてがＦになる」から一年半後になります。場所は三重県の青山高原ですが、あまりしっかりと記述していません。実名で友人が２人登場します。\n天才数学者の館「三ツ星館」が舞台です。実はその建物の断面図まで決めていたのですが、専門的になりますので結局はカット。こんなシンプルな住居に住みたいものです。\nさて、この作品は、最も、ミステリィファン以外の方に向いているでしょう。５連作の中で１冊読むならこれにして下さい。５連作の中でもっとも自分の納得のいく作品だからです。\n北村氏より頂いた凝った推薦のとおり、トリックは簡単で、誰でも気づくものです。意図的に簡単にしたのです。しかし、トリックに気づいた人が、一番引っかかった人である、という逆トリックなのですが、その点に気づいてくれる人は少ないでしょうね。でも、少なくとも北村氏は気づいたのですから、森としては、これでもう十分です。\n算数の問題について、沢山のハガキが寄せられました。この謎も意図的に残したものです。\n蛇足ですが、何故、「笑わない数学者」というタイトルにしたのか・・、それが逆トリックのヒントです。","文庫は、2011年秋より順次カバーが新しくなりました。\n書いたのは95/11。イージーリスニング的な作品だと自分では思っていますが、読者がどう感じるかは未知。以前、漫画で「詩的私的素敵」という作品を書いたので、そのタイトルにイメージを重ねています。\n連続・密室・猟奇・殺人でしょうか？　はは、よくわかりません（少なくとも猟奇ではないですが）。本物のＮ大の生協委員のインタヴューに答えたとおり、Ｎ大祭が出てきます。この他、塩釜口に実在する某私大（本当はＭ大ですが、Ｔ大としました）、それに地元の某女子大（これは、そのままＳ女子大）を少しだけ舞台にしています。Ｓ女子大では森は非常勤講師をしたことはありませんが、一度だけ、そこで「親と子の建築セミナー」という催しをして、教室で講義をしたことがあるので、勝手にロケーションを使いました。森の奥様（スバル氏）はこの作品が５連作の中で一番面白いとおっしゃっています（たぶん、一番簡単だから？）。\nロックスターが出てきます。森自身は、音楽と言えばハードロック、プログレッシブ（今でも言うのかな？）しか聴かないので、このお話も少しだけ地が出ます。講談社の唐木さんは、「笑わない数学者」と「鉄鼠の檻」が禅で、「詩的私的ジャック」と「絡新婦の理」が女装。この関連は何故か、なんて真剣に悩んでましたが、たぶん、それは偶然だと思います。推薦は、本物のＮ大出身の大先輩、辻真先氏からいただきました。「封印再度」のまえに読まれることをおすすめします。","文庫は、2011年秋より順次カバーが新しくなりました。\nこれは、「Ｆ」が発行になる直前、1996/2に書いたものです。５連作の最後、一番長い（字数が多い）お話です。おそらく、読者から非難轟々の反響が予想されます（なんて思っているのは作者だけでしたね。今のところ、幸いなことに非難は受けておりません）。タイトルで期待してる方が沢山いたのです。それは、「Dr.S.M.が再登場する」という噂でした。英語のタイトルの、InsiderとInsideがダブっているからでしょうか？　さて、どうなんでしょう？\nご紹介と言いながら、内容を詳しく書けないのがミステリィの宿命ですね。難しい・・。\n４作目の「詩的私的ジャック」の半年後の年末からお話は始まります。萌絵の叔母様が初登場です。あと、刑事さんは４作目の鵜飼さんが大活躍かな。舞台は岐阜県の明智町の旧家で、またまた密室ものです（別に自分としては密室ものにこだわってるつもりはないのですが）。さて、この５連作を「理系」ミステリィとまだ呼ぶのでしょうか？　本作品こそ、「禅」をテーマにしたんですが、はは、どうも意図しない方向へ・・。いやいや、外していないはずです。十牛図も、鉄鼠の檻とバッティングしちゃったけど・・、まあ、いいや。そんなこんなで（どんなの？）京極夏彦氏より推薦を頂きました。こちらこそ、ごちそうさまでした。","文庫は、2011年秋より順次カバーが新しくなりました。\nさて、舞台は那古野市内。偉大なマジシャンが登場します。しいて言えば、「死体消失」トリックものかなあ・・。仕掛けが大きいほどつまらない、ということを一つパロディにしています。それから、一つ隠しネタもあるんですが・・。表紙の折り返しのところにあるイラストは森が書きました。このシリーズから全作、イラストと詩がおまけでつきますよ（無理があるなあ）。","文庫は、2011年秋より順次カバーが新しくなりました。\nこの作品も1996/8に書き上げました。この長編7作目は、「孤独な数字の７にちなんで」ちょっとだけ異色だと思います（笑）。誘拐事件を扱っていますけど、もちろん殺人事件になります。舞台は那古野市北部、犬山と、長野県の駒ヶ根です。長編6作目の「幻惑の死と使途」は対になっていますが、特にどうという仕掛けはありません。まあ、一種のリアリティを書きたかっただけです。一応、切り放せない2連作ですね。同時に読むこともできます（前作が奇数章、本作が偶数章で構成されているので、通して読むと、ほのかに面白いと思われます）。","文庫は、2011年秋より順次カバーが新しくなりました。","文庫は、2011年秋より順次カバーが新しくなりました。","文庫は、2011年秋より順次カバーが新しくなりました。"],
 v:["新シリーズ（コードネーム：Ｖシリーズ）のコンセプトは、シンプル、シャープ、スパイシィのＳＳＳです。主な登場人物は、バツイチお嬢様の瀬在丸紅子、ピンクハウス系武道家の小鳥遊練無、関西弁系ラブちゃんの香具山紫子、そして、いよいよ本物のハードボイルドか、保呂草潤平。この他にもキャラはどんどん増えそうです。シリーズの最初ということで、本作の事件はそれほど派手ではありませんが、やはり密室ものです。舞台が那古野市というのはＳ＆Ｍシリーズと同じ。さて、このシリーズいくつ続くでしょうか・・。犀川＆萌絵シリーズがミステリィ版「動物のお医者さん」だとすると、今度のは、ミステリィ版「めぞん一刻」という噂がナキニシモアラズ。","さらにＳＳＳを突き詰めて短いＶシリーズの第２話です。多少古典的な雰囲気かも（自分では新しいつもりですが）。舞台は長野県のリゾート地（はっきりいうと、白樺郷です）の人形博物館。これは、珍しく、密室ものではありませんね。祖父江七夏という名の刑事と森川素直が新キャラで登場。","Ｖシリーズの第３話。これも短い長編です（変な表現）。またまた、密室ものになりました。舞台はとあるお金持ちのお屋敷。パーティ中に奥のオーディオ・ルームは血の海に（凄い表現！）。完全密室に忍び込んだのは、はたしてこの世の存在だったか（うーん、自分で書いていて笑えてくる）。月の夜といえば、そうそう、あれですね〜（団子じゃないよ）。","Ｖシリーズの第４話。さて阿漕荘麻雀仲間4人は上京してテレビに出演することに。スタジオでリハーサル中に隣の部屋で奇怪な殺人事件が勃発。小鳥遊君大活躍の一話。","Ｖシリーズの第5話。エアロバティックス・ショーを舞台に巻き起こる謎の事件に、４人組が挑みます。舞台は愛知県北部。","Ｖシリーズの第6話。豪華客船で起こったちょっと奇妙な事件。これは異色でしょう（きっと、たぶん・・、だと思う）。","Ｖシリーズの第7話。そろそろ館ものが読みたい、とお待ちかねの諸兄に（笑）。","Ｖシリーズの第8話。講談社ノベルス20周年記念のメフィスト賞作家による「密室」書下ろしシリーズにも参加しています。これまでで一番短い長編作品（？）。懐かしいキャラが登場します。","Ｖシリーズの第9話。実は「六人の超音波科学者」の続編的位置づけになります。別にどんな順番で読んでも支障はありませんけれど。地下密室＆宇宙密室なんてオビに書かれてしまいました。","いよいよＶシリーズも第10話。久しぶりにシリアルキラをテーマにしてみました。本シリーズでは最長になりました。Ｖシリーズはこの10話で一応の完結です。"],
 sh:["「四季」という１つの作品です。ですから、本当はシリーズではありません。４章立てになっていたものを、ノベルスでたまたま分冊して発行することになり、「春」「夏」「秋」「冬」という本に分かれました。この「春」では、真賀田四季が５歳から８歳くらいの時代が物語の中心です。\nおそらく、これを読んだ多くの人は、「Ｓ＆ＭシリーズやＶシリーズを読んだ人でなければ、わからない」と言うでしょう。しかし、作者は、全然そうは考えていません。これは独立した作品です。むしろ、こちらをさきに読んだ方が良いかもしれません。少なくとも、作者はその順に発想しています。ただし、「すべてがＦになる」の読者は現在40万人以上はいるわけですから、「Ｆ」既読者が読む確率が高いというだけのことです。\nこの作品は初めての試みとして、試読会を行いました。発行まえにファンの方、書店の方にゲラを読んでいただいたのです。このときの感想をこちらへアップしました。\n文庫化に際して、読者から解説・感想を募集しました。読者もそうですが、作家としても、文庫に一般の方の声を直接載せられるような機会は滅多にないと思います。編集部も大変だったでしょう。各方面に感謝します。\nThe Four Seasons","解説（感想）：一般公募\n２冊目の「夏」では、真賀田四季が13歳くらいの年代が語られます。視点の設定が、ここだけ特異で、執筆が非常に難しい作業となりました。\nThe Four Seasons","解説（感想）：一般公募\n３冊目の「秋」は、ずっとあとの時代の物語。\nThe Four Seasons","解説（感想）：一般公募\n４冊目の「冬」は、さらにその後の物語。\nThe Four Seasons\n四季（愛蔵版BOX）\nThe Four Seasons"],
 g:["講談社ノベルスのミステリィは、Ｓ＆Ｍシリーズ10話、Ｖシリーズ10話、と続きました。その後の『四季』はもともと１つの作品を4冊に分けて発行したものですので、厳密にはシリーズではありませんでした。今回、３つ目のシリーズとして、新しくスタートさせるものです。シリーズ名はまだ決まっていません。第２話『θは遊んでくれたよ』が出たあとに、シリーズ名を確定する予定です。\nミステリィについて自分なりに見直し、あまりトリッキィなものではなく、どろどろしたものでもなく、真正面から誠実に、シンプルできめの細かい作品を書きたいと思うようになりました。また、矛盾しているように感じられると思いますが、一方では書かなくても良いことを極力書かない、という当たり前の素直な方針を掲げ、ナチュラルでアキュラシィな作りをなんとか目指したいと今は考えています。","Ｇシリーズと決めました。第２弾は、シリアルキラもの、といえるでしょうか。少なくとも、久しぶりに密室ものではありません。懐かしいキャラクタが登場します。","Ｇシリーズ第３弾はずばり「館もの」で、もちろん密室です。","Ｇシリーズの第４弾。バスジャックで人質になった加部谷恵美と山吹早月、という物語。これまでのミステリィからすると、多少異色かもしれません。これまでのシリーズでも、第4話は方向性が少し変わって、目新しさがあったかと思います。","Ｇシリーズ第５弾で、またまた密室もの、舞台は、またまた研究所です。","Ｇシリーズ第６弾です。カバーに「ターニングポイント」と書かれていました。編集者が読んで、そう感じたのでしょうか。","Ｇシリーズ第７弾です。目薬に劇物が混入された事件が各地で起こり、また殺人事件も発生します。このシリーズが何を目指そうとしているのか、だんだんわかってくるのでは……。","Ｇシリーズ第８弾です。夏休みを利用したわけではありませんが、加部谷恵美たちが訪れた美之里というパーク内で事件が起きます。前作の発行から４年が経ちましたが、当初から予定していたことで、作品の中でも同様に月日が流れています。","Ｇシリーズをスタートさせたのは、９年以上まえになります。今回が９作めになりますが、当初のデザインどおりの路線をずっと維持し、少しずつ目標へと近づいている、と自分では評価しています。このあと、また少し時間があきます。","Ｇシリーズも佳境となりました。10作めは、少々趣が異なります。前作のγでお馴染みの面々総出演だった理由がわかると思います。また、前作に登場した島田文子が主人公です。タイトルは、もちろんクイーンの名作に擬えたもので、引用文も同作からいただきました。書いていて一番気になったのは、「これは、はたして悲劇なのだろうか」という点でした。","Ｇシリーズの11作め。舞台は日本。前作に引き続き、島田文子がメインキャラの一人として登場。また、クイーンの名作に擬えているのも同様。前作よりは、「悲劇」らしいかもしれません。残り１作となりました。長いシリーズでしたね（感慨）。","Non-seriesの「オメガ城の惨劇」の文庫化です。もともと、Ｇシリーズの最終巻として構想していた作品でしたが、メフィスト誌への寄稿を依頼され、一旦はシリーズ外作品として発表しました。"],
 x:["Ｘシリーズの第１弾。これまでのシリーズとはまた少し違って、少々レトロなものを書きたいと思います。ノスタルジィでしょうか。もちろん、新しさあってのレトロですが。Ｇシリーズの途中に、このシリーズをスタートさせるのも、当初から計画していたことです。","Ｘシリーズの第２弾。こういったものが、これまでなかなか書けなかったのですが、今回は機が熟したというか、いろいろな面で、「書けるようになった」ということです。","Ｘシリーズの第３弾。これも、今まで書こうと発想して書けなかった類のものです。「書けるようになった」というのはどうしてでしょう。たぶん、文字どおりポテンシャルの問題かと。","６年半ぶりに書いたＸシリーズですが、特に違和感もなく（前作を読み直すこともなく）、自然に書くことができました。このシリーズは、非常に自然体だからでしょう。実は、次作も既に書き上がっています。","Ｘシリーズの第５弾です。こういうのは一度書いてみたいとまえから考えていましたが、なかなかシンプルにできず、実現しませんでした。ようやく形になった（書けるようになった）、といったところ。でも、その「こういうの」がどういうのかは、たぶん誰にもわからないでしょう。いちおう、次作でＸシリーズは終了予定です。","Ｘシリーズ最終作になります。自分なりに考えて、リアリティを描いたシリーズになったかと思います。たった６作だったのに、執筆に10年もかかりました。当初予定していたとおりの展開となり、書き残したこともありません。"],
 xx:["そこにオチがあるのか、というミステリィを書いてみました。日本で「ミステリィ」と呼ばれるジャンルでは、あまりにもフォーマットが整いすぎていないか、と感じたからです。気がついてみれば、過去にも、この手の異端なミステリィを書いているので、今さらではありますけれど。でも、開き直って真正面から書いてみたかったような気もします。","『馬鹿と嘘の弓』と同じ登場人物で、話が続いています。シリーズになるのかどうかは、読者が求めているかどうか、だと思います。「探偵もの」を素直に書いた結果なのですが、その意味では、Ｘシリーズに近いテーマでしょう。Ｘシリーズは、まだ従来の「ファンタジィとしての探偵」だったように反省し、その追加的補正をしているような形です。もちろん、小説にはテーマなど必要ないと考えている作者なので、ちょっとした「気の迷い」程度だとご解釈下さい。","３冊めが出ることになり、シリーズとなりました。ＸＧシリーズとしても良かったのですが、やはり場所や環境がＸの後続であるため、ＸＸシリーズにしました。二人の地味な探偵業はいつまで続くのでしょうか。"],
 mr:["百年後の未来、主人公と人造人間のコンビが迷い込んだ秘密の王国。そこで起こる不思議な殺人事件。人の生とは、死とは何か？　何が人を生きさせるのか（ちょっと真面目に書いてみました）。この写真ではちょっとわかりませんが、鈴木成一氏によるブックデザインが秀逸です。","サエバ・ミチルとロイディが登場する「女王の百年密室」の続編です。今回の舞台は、イル・サン・ジャックという、一夜にして周囲が海になったという伝説の島。ここで、首なし死体が見つかり、事件にミチルが巻き込まれます。",""],
 w:["ＧシリーズもＸシリーズも未完なのに、新しいシリーズの執筆依頼を受けました。ＧもＸもあと少しだったので（「もう少し待ってほしい」と）抵抗したのですが、これまでにない強いプッシュで、編集部の本気度がわかり、引き受けました。まったく新しいシリーズで、舞台は未来。このＷシリーズは講談社タイガから文庫書下ろしで出版されます。小説では文庫書下ろしは初めてで、デビュー以来の念願でもありました。とりあえず、10作くらいは続けるつもりで、しばらくは年３作のペースで出ます（１作めが刊行される時点で、３作めまでは脱稿しています）。","Ｗシリーズの２作めです。主人公は第１作と同じくハギリ博士。ガードをする局員は、一人増えます。チベットが舞台になり、スリリングな展開となりますが、１作めの「魔法」が効いた理由が明らかになります。\nこのシリーズを読むためには、旧作のどれを読んでおく必要があるのか、というご質問を受けますが、べつにどれも読む必要はありません。シリーズ内であっても、順番に読まなくてもけっこうです。ただし、どうしても挙げろと言われれば、百年シリーズ３部作でしょうか。その次は、Ｇシリーズ（今年10作めが出ますが）かな、といったところです。","Ｗシリーズの３作めで、前作と同じく、チベットが舞台です。ハギリ博士は、ウォーカロン・メーカを訪ねたり、遺跡のような場所へも行きます。\n読者からの声によれば、このシリーズを（森作品の）最初に読まれている方が予想以上に多いようです（それでけっこうだと思います）。これが発行される現在、既に、５作めまで脱稿しています。","Ｗシリーズ４作めの舞台は、フランスです。ハギリ博士とウグイたちは、ここでスーパ・コンピュータを相手にします。本作で初めて登場するトランスファという存在は、今後のシリーズの鍵となるものかもしれません。\nこれが発行される現在、既に６作めは脱稿し、７作めを執筆中です。","Ｗシリーズも５作めです。舞台は、アフリカの南端。失踪したウォーカロンたちの居場所が判明します。ハギリ博士は、世界中を飛び回っていますね。今回も、トランスファが大活躍（かな？）。夢の仕事をしている人たちも出てきます。","６作めです。今回の舞台は北極。そこに、またも古いスーパ・コンピュータが潜んでいます。ハギリ博士とウグイが、このコンピュータとコンタクトを取るために出かけていく、というお話です。","もう第７作です。今回の舞台はインドのある富豪の邸宅です。ミステリィなら普通の舞台ですが、本シリーズでは初めてです。そのためなのか、かなりミステリィっぽい内容になりました。多少複雑な部分もあるかもしれませんが、気にしないで下さい。今回から、ハギリ博士の護衛は、キガタ・サリノになります。","第８作は、最初は、エジプトのピラミッドが舞台です。後半はもっと遠くへ出かけます。トランスファもスーパ・コンピュータも、もちろんウォーカロンも入り乱れて登場。動きのあるストーリィかもしれません。キガタ、アネバネ、ウグイも活躍します。","第９作は、主に日本が舞台です。ウォーカロン・メーカで不可思議な事件が起こり、ハギリ博士が、キガタ、アネバネ、ウグイとともに現地へ向かいます。いったい誰が何のために仕組んだことなのか、といった謎が提示されます。もちろん、トランスファやスーパ・コンピュータも登場。\n人間のように泣いたのか？","Ｗシリーズ最終作です。今回の舞台はまた日本。国際会議が開かれる会場で事件が起こります。ハギリ博士とウグイが、ずっと一緒にいます。もともと、英題の主語は、Itだったのですが、書き上げたあとでSheに変更しました。一言でいえば、「歩み寄った」という感じでしょうか。このシリーズは、初めての文庫書下ろしで、電子書籍も同時配信でした。ちょうど３年間で、10冊をコンスタントに出すことができ、滑らかに終わったかな、と思っています。"],
 ww:["Ｗシリーズを書き始めたときには、せいぜい10作が限度だろう、と感じていましたが、書いてみたら、わりとイメージが広がり、もう少し書けるかもしれないと途中で感じました。ということで、新しいシリーズを要望され、自然に始めることになりました。特に、さきのことは考えていません。Ｗシリーズがそもそもそうだし、これまでのシリーズはすべて同じですが、１作完結を基本としてきましたから、今回も同じスタンスで書くつもりです。いくつまで続くかわかりません。ただ、少しペースを落とすつもりではいます。\n神はいつ問われるのか？","ＷＷシリーズの第２作です。ヴァーチャル界が舞台となっていますが、特に珍しくもないかと。「登場人物」という場合の、「場」とは、どこを示すのか、という細やかな問題を抱えつつ書きました。これは、Ｗシリーズにおいては、「人」とは、どの範囲を示すのか、という問題を抱えていたことに類似しているかもしれません。アリスという女の子が出てきますが、ハイジでも良かったかな、と少々後悔しています（ジョークです）。","ＷＷシリーズ第３作は、ミステリィっぽい始まり方、あるいはシチュエーションです。なんか、某処女作に類似しているのでは、と思われた方もいらっしゃることでしょう。作者も書いている途中で、そういえば、と気づきました。はっきりいって、まったく似ていませんのでご安心下さい。","ＷＷシリーズ第４作は、幽霊騒動に巻き込まれる主人公たち。生命や現実といった概念がシフトしている時代において、幽霊とはどんな存在となるのか、といったテーマかも。誰が創出したのかって、もちろん人間以外にありませんけれど。","ＷＷシリーズ第５作は、絶滅危惧種の動物を巡る騒動。既にクローンが完全に実用化し、絶滅は回避されている世界ですが、種の保存ではなく、そうした動物のコントロールについての研究が密かに行われている、といった疑惑が持ち上がります。","ＷＷシリーズ第６作は、ヴァーチャルで会った女性からの依頼で、失踪したリアルの彼女の行方を追うことになります。しかも、このリアルの彼女は、いつの間にかウォーカロンとすり替えられていた疑いが浮上。さらに、ヴァーチャル国家の独立騒動に、この失踪事件が関係してきます。","ＷＷシリーズ第７作です。舞台は久しぶりに日本。未知のウィルスが、新しい検査方法によって発見されます。また、前作で話題となった人物の一人が遺体で発見され、グアトたちは、キョートの博物館を訪れます。ウォーカロン・メーカが開発した新細胞がついに予約開始となりますが……。","ＷＷシリーズ８作めです。最近では、１年に１作というペースになりましたが、来年はどうでしょうか。今作は、ある科学者の研究に関するミステリィで、やや難解な部分があるかもしれませんけれど、諦めずに読んでいただければ、と思います（願望）。"],
 sc:["文庫版は期間限定で映画『スカイ・クロラ』のキャラクタ（西尾鉄也画）のカバーのものがありました。\nスカイ・クロラシリーズの第１巻。書下ろしです。森博嗣の本質に最も近いシリーズだと思います。","文庫版は期間限定で映画『スカイ・クロラ』のキャラクタ（西尾鉄也画）のカバーのものがありました。\nシリーズ第２巻。書下ろしです。「ナ・バ・テア」の後編に近い内容です。","文庫版は期間限定で映画『スカイ・クロラ』のキャラクタ（西尾鉄也画）のカバーのものがありました。\nシリーズ第３巻。書下ろしです。内容的には、第２部になるのかも。","文庫版は期間限定で映画『スカイ・クロラ』のキャラクタ（西尾鉄也画）のカバーのものがありました。\nシリーズ第４巻。書下ろしです。この本が最後に発行されました。","文庫版は期間限定で映画『スカイ・クロラ』のキャラクタ（西尾鉄也画）のカバーのものがありました。\nシリーズ第５巻。書下ろしです。この本が最初に発行されましたが、完結編です。","スカイ・クロラシリーズの短編集で、８つの物語を収録。うち４作はWeb連載、１作は「Ｃ★Ｎ25」に掲載、３作は書下ろしです。\nジャイロスコープ　Gyroscope\nナイン・ライブス　Nine Lives\nワニング・ムーン　Waning Moon\nスピッツ・ファイア　Spit Fire\nハート・ドレイン　Heart Drain\nアース・ボーン　Earth Born\nドール・グローリィ　Doll of Glory\nスカイ・アッシュ　Ash on the Sky"],
 vs:["この作品は、2004年頃に構想したものです。当時は、スカイ・ クロラシリーズが３作で終わるだろうと考えていたので、その後にこの シリーズを始めようと計画しました。ところが、「スカイ・クロラ」の 映画化が決まり、シリーズは最終的に６冊にもなりました。新シリーズ の発行は、約７年遅れたことになります。知らないうちに世間ではすっかり歴史ものが流行し、時代劇ブームになっていますが、それを狙ったわけでは全然ありません。まあ、読めば、それはわかっていただけると思いますが……。\nブラッド ・ スクーパ","順調の２作めが書けました。ヴォイド・シェイパのときと同じく、雑誌『ダ・ヴィンチ』からインタビューを受けました。そこでも答えましたが、非常にナチュラルな気持ちで書いています。まったくあらすじを考えず、思いつくままに書き、書きながら自分でもストーリィを楽しめました。小説らしい小説ではないでしょうか。ほんの少し、小説家になった気分です。インタビューにも答えましたが、このシリーズは当初の予定の３作ではなく、５作は必要だな、と今は感じています。\nスカル ・ ブレーカ","","シリーズ４作めです。都会を離れて森の中に住むようになってから書き始めたシリーズですので、風景や気候などをイメージしやすく、とても自然に書けるな、と感じています。単行本のデザインも良いのですが、文庫のデザインも気に入っています。そうそう、電子化は３冊めが出ます。つまり、１年後に電子化、２年後に文庫化、ですね。さきのことはまるで考えていませんが、シリーズは５冊で完結しそうにない、というのが今のところの印象です。もうやめてくれ、と言われたらいつでもやめますが……。\nマインド ・ クァンチャ","シリーズ５作めです。当初予定していたストーリィはここまででしたので、これでシリーズ完結としても良いと思っています。次も書くかどうかは、まだ決めていません。お話は、またも山の中で展開します。主人公が強さを求めるとき、欠けていたものが偶然にも手に入ります。カバーは、満を持しての桜です。もちろん、「桜にして下さい」と僕が依頼してこうなりました。それでも、その桜がまた想定外に綺麗でした。シリーズもこれで終わりにするのが、綺麗かもしれません。"],
 mizu:["幻冬舎の小雑誌「PONTOON」に掲載された4短編と書下ろしの1編。水柿助教授と須摩子さん夫婦の日常を描いたアンチミステリィ（笑）。","幻冬舎の小雑誌「星星狭」に掲載された5短編を収録。水柿助教授と須摩子さん夫婦の日常を描いたアンチミステリィ（笑）の続編です。このシリーズはまだ続きます。","幻冬舎の「星星峡」に連載された５編を収録。水柿助教授と須摩子さん夫婦の日常を描いた物語の完結編です。これで終わり。もう出ません。"],
 z:["雑誌「ジャーロ」に連載した、Ｚシリーズの短編を５作収録。かなりアンチな小説です。表紙は佐久間真人氏です。","雑誌「ジャーロ」に連載した短編を５作収録。Ｚシリーズの第２弾ですが、話は繋がっていません。登場人物が共通しているだけです。表紙は佐久間真人氏です。","雑誌「ジャーロ」に連載した短編を５作収録。Ｚシリーズの第３弾で、これで終わりです。登場人物が共通しているだけなので、どの巻から読んでも関係ありません。表紙は佐久間真人氏です。"],
 short:["講談社ノベルスの短編集に収録されたＳ＆Ｍシリーズの短編を１冊にまとめた本です。もともとは、文庫だけを作るつもりでしたが、著作累計1000万部突破記念として、少部数だけハードカバーになりました。\nぶるぶる人形にうってつけの夜　The Perfect Night for Dancing Doll（メフィスト）\n誰もいなくなった　Thirty Little Indians（まどろみ消去）\n石塔の屋根飾り　Roof-top Ornament of Stone Ratha（PONTOON）\nマン島の蒸気鉄道　Isle of Man Classic Steam（メフィスト）\nどちらかが魔女　Which is the witch?（メフィスト）\n双頭の鷲の旗の下に　Unter dem Doppeladler（メフィスト）\nいつ入れ替わった？　An exchange of tears for smiles（メフィスト）\n刀之津診療所の怪　Mysteries of Katanotsu clinic（メフィスト）","講談社ノベルスの短編集に収録された作品の中から、著者が気に入っているものを選んで１冊にまとめた本です。「シリーズ短編集」と２冊同時発行になりましたが、もともとはこちらが作りたかったのです。ですから「自選」という表現は間違っていません。\n虚空の黙祷者　Silent Prayer in Empty（まどろみ消去）\n小鳥の恩返し　The Girl Who was Little Bird（メフィスト）\n赤いドレスのメアリィ　Mary is dressed in red（別冊文藝春秋）\n探偵の孤影　Sound of a detective（小説新潮）\n卒業文集　Graduation Anthology（今夜はパラシュート博物館へ）\n心の法則　Constitutive Law of Emotion（まどろみ消去）\n砂の街　The sandy town（レタス・フライ）\n檻とプリズム　A prism in the cage（メフィスト）\n恋之坂ナイトグライド　Gliding through the Night at Koinosaka（メフィスト）\n素敵な模型屋さん　Pretty Shop of Models and Toys（今夜はパラシュート博物館へ）\nキシマ先生の静かな生活　The Silent World of Dr. Kishima（まどろみ消去）\n河童　Kappa（小説すばる）\n僕は秋子に借りがある　I'm in Debt to Akiko（小説すばる）","講談社の宇山さんに、短編をと依頼されたので、96年の春に書いたものです。メフィスト誌に掲載するつもりで依頼されたと思いますが、いざ書いてみると、ばらばらにしたくない。全部で一つの作品だと思えてきて、結局、いきなり短編集で出してもらえました。ですから、もちろん書下ろしってことになりますね。短編が11編。全部合わせても、一番短い（15万文字弱）。つまり、一番薄い本になりました。なかには、ミステリィとはいえないものも混ざっています。犀川と萌絵のシリーズでもありません。たぶん、これが一番、森らしい作品です。収録作品は以下のとおりです。\nええ、実は、この本、旧友、山田章博氏のイラスト付きです。全部で12枚あります。山田氏には、どんな感謝の言葉も足りません。ここに付記して謝意を表します。\n虚空の黙祷者　Silent Prayer in Empty\n純白の女　The Lilies of Her Cheeks\n彼女の迷宮　She is Lost in Mysteries\n真夜中の悲鳴　Acoustic Emission\nやさしい恋人へ僕から　To My Lovely\nミステリィ対戦の前夜　Just Before the Battle for Mysteries\n誰もいなくなった　Thirty Little Indians\n何をするためにきたのか　The Identity Crisis\n悩める刑事　A Detective in Distress\n心の法則　Constitutive Law of Emotion\nキシマ先生の静かな生活　The Silent World of Dr. Kishima","まどろみ消去以来の短編集。いわゆる「幕間」ですね。収録される全10作の短編のうち7作は、雑誌（メフィスト、小説すばる、PONTOON）に掲載されたものです。結果的に、3作が書下ろしになりました。収録作品は以下のとおりです。ささきすばる氏のイラストがつきます。\n小鳥の恩返し　The Girl Who was Little Bird（メフィスト）\n片方のピアス　A Pair of Hearts（メフィスト）\n素敵な日記　Our Lovely Diary（メフィスト）\n僕に似た人　Someone Like Me（書下ろし）\n石塔の屋根飾り　Roof-top Ornament of Stone Ratha（PONTOON）\nマン島の蒸気鉄道　Isle of Man Classic Steam（メフィスト）\n有限要素魔法　Finite Element Magic（書下ろし）\n河童　Kappa（小説すばる）\n気さくなお人形、19歳　Friendly Doll, 19（書下ろし）\n僕は秋子に借りがある　I'm in Debt to Akiko（小説すばる）","Ｖシリーズが５冊出揃ったところで幕間の一冊。短編集の第３弾。収録される作品のほとんどは、雑誌（メフィスト、小説新潮）に掲載されたものです。収録作品は以下のとおり。コジマケン氏のイラストがつきます。\nどちらかが魔女　Which is the Witch?（メフィスト）\n双頭の鷲の旗の下に　Unter dem Doppeladler（メフィスト）\nぶるぶる人形にうってつけの夜　The Perfect Night for Shaking Doll（メフィスト）\nゲームの国　The Country of Game（メフィスト）\n私の崖はこの夏のアウトライン　My Cliff is the Outline against this Summer（小説新潮）\n卒業文集　Graduation Anthology（書下ろし）\n恋之坂ナイトグライド　Gliding through  the Night at Koinosaka（メフィスト）\n素敵な模型屋さん　Pretty Shop of Models and Toys（書下ろし）","短編集も4冊目になりました。収録される作品はすべてアンソロジィや雑誌に掲載されたものです。島田荘司氏編纂の「21世紀本格」に収録された「トロイの木馬」は、初めての中編かもしれません。本短編集に収録することを前提で書かせていただいたものです。収録作品は以下のとおり。ささきすばる氏のイラストがつきます。\nトロイの木馬　Trojan Horse Program（21世紀本格）\n赤いドレスのメアリィ　Mary is Dressed in red （別冊文藝春秋）\n不良探偵　Defective in Detective（小説推理）\n話好きのタクシードライバ　That's Enough Talking of Taxi Driver（角川ミステリ）\nゲームの国（リリおばさんの事件簿１）　The Country of Game（メフィスト）\n探偵の孤影　Sound of a Detective（小説新潮）\nいつ入れ替わった？　An Exchange of Tears for Smiles（メフィスト）","５冊目の短編集です。少し長いものが２編、とても短いものが５編含まれています。収録作品は以下のとおり。ささきすばる氏のイラスト（カラーも）がつきます。\n文庫版には「ライ麦畑で増幅して」が収録されています（ノベルス版には未収録）が、この短編はＸシリーズに含まれる作品です。\nラジオの似合う夜　A radiogenic night（メフィスト）\n檻とプリズム　A prism in the cage（メフィスト）\n証明可能な煙突掃除人　Provable chimney sweeper（IN★POCKET）\n皇帝の夢　The imperial dream（IN★POCKET）\n私を失望させて　Drive me to despair（IN★POCKET）\n麗しき黒髪に種を　Seeds for her lovely tresses（小説現代）\nコシジ君のこと　My most unforgettable figure（IN★POCKET）\n砂の街　The sandy town（書下ろし）\n刀之津診療所の怪　Mysteries of Katanotsu clinic（メフィスト）\nライ麦畑で増幅して　The Amplifier in the Rye（メフィスト）−文庫版のみ収録"],
 etc:["これはシリーズ外の単発ものです。とある建造物の中に作られた特殊な環境（？）の中へ、６人の科学者たちが閉じ込められます。そして、一人ずつ殺され、二人だけになります。一人は盲目の天才科学者（意外と若い）。もう一人はそのアシスタントの女性。しかし、二人とも実は・・。死体が握らされているボールはいつも二つ。しかも、その材質は、ばらばら。出入りが絶対にできない密室。誤動作するコンピュータ。ああ・・、ここまで書いたら、もう結果はわかっちゃいましたね！","集英社の小説すばるに掲載された5短編を取りまとめました。これは、ジャンルは何でしょうね・・。少なくとも本格ミステリィではありません。単行本と文庫は、表紙が金子國義氏。ノベルス版は森博嗣が昔描いた絵(笑)。落差が激しいですね。","雑誌『ダ・ヴィンチ』に２年間連載したものに、最後の書下ろし部分をつけてまとめました。イラストはコジマケン氏。カラーのイラストが沢山あります。ちょっとフーガなポエティカル・ミステリィ・・ってことですが、よくわかりませんね。","","角川書店から発行する最初の本になりました。雑誌『野性時代』に１年半の間連載した長編小説で、連載開始時には、「森博嗣初の恋愛小説」と書かれましたが、本人は特に意識はしていません。ミステリィの場合でも、「さあ、ミステリィを書くぞ」とは考えませんし、書いているうちに、だんだんわかってくるのです。","コカ・コーラ120周年の企画の一環として依頼され、書下ろした作品です。最初からＴＶドラマ化が決まっていたので、映像になりやすい設定にしましたが、結果的には、原作とドラマはかなり異なったものになりました。特徴としては、非常に「さわやか」な物語になったと思います。","「別册文芸春秋」に連載した小説です。短い話に分かれていますが、短編集ではなく、一連の物語。今まで書いたもののなかでは、一番文学っぽい感じかもしれません。この方面には、今後もチャレンジしたいと思います。","いつかはハードボイルドを書いてみたいという気持ちがあって、ようやくそれが書けた、というのがこの作品です。日本を舞台にしたハードボイルドは無理だと思っていましたが、そろそろ書けそうなくらい日本が豊かになった気がします。","７年半もあいてしまいましたが、ようやく第２作が書けました。日本も豊かになったので、ハードボイルドが書けるようになった、と前作で思いましたが、やはりまだ少し足りないかも、と感じて、主要な登場人物を外国人にしました。これだけで、ずいぶん書きやすくなりました。第３作は、なるべく早く書くつもりです。","「野性時代」に連載した長編小説です。連載の場合、短編のように分かれているものが多いのですが、長編で連載というのは、「どきどきフェノメノン」に続き、２作めですね（何故かいずれも「野性時代」）。そうですね、わりと、珍しくサスペンスものかも。","「別册文芸春秋」に連載した小説です。連載したので、短い話に分かれていますが、短編集ではなく、長編です。","萩尾望都先生の名作の小説化です。この企画は、講談社文三の部長だった宇山氏から提案されたものでした。萩尾先生の許可をいただいて執筆し、また、書き上げたあとも、先生に読んでいただいたうえで、出版するかどうかを決めました。大変光栄な仕事だったと思います。原作の美しさを損なわず、いかに小説作品として成り立たせるか、という難しい課題でした。カバーや各章のトビラのために、萩尾先生から描き下ろしのイラストをいただいています。\n文庫版では、萩尾先生への感謝を込めて、珍しく「あとがき」を書かせていただきました。","講談社創業100周年記念出版として執筆を依頼されたものです。「まどろみ消去」や「僕は秋子に借りがある」にも収録されている短編「キシマ先生の静かな生活」を長編として書き直したものです。書籍の発売と同時に、iPad版が発売されます。また、旧作の同短編の方もiPad版が発売されます（電子出版は、短編１作でも発売できる点がメリットの１つといえます。「四季」愛蔵版の購入者に配布された豆本もありますので、短編だけの出版は初めてではありませんが）。","６年ほどまえに企画された本で、ずっと予定されていましたが、ようやく執筆できました。編集者が、「家族小説」というジャンル名をつけました。そういう小説があるとは知りませんでした。たぶん、家族小説ではないと思います。わかりやすい部分でいつもと変わっているところといえば、会話文がほとんどないことでしょうか。","","これは、2013年の２月の前半に書いた作品です。ＳＦを書くつもりだったのですが、急にミステリィになりました。シリーズではない作品というのは、自由に設定ができるので、書き始めは面倒ですが、書いている途中どんな発想があっても取り入れることができて、その点では面白いものになりやすいと感じています。ストーリィ・テリングに徹した、海外翻訳っぽい作品になりました。","谷崎潤一郎のメモリアルとして企画された本です。内容としては、幻想小説といえると思います。ただ、どの作品の「リスペクト」というわけではありません。そもそも、谷崎の影響を受けているといっても、谷崎のようには書かない、という方向性もあるわけです。これもリスペクトなのですが、文芸界で使われている「リスペクト」とは意味が違いますね。\nSAIKAWA Sohei’s Last Case\nメフィスト誌での連載を依頼されて執筆した作品です。プロローグと各章を連載し、最後のエピローグだけは雑誌ではなく、書籍で掲載するという条件で引き受け、実際には、連載が始まる以前に全編を書き上げました。雑誌で最終章が発表される以前に、単行本とノベルスが同時に発行されることになり、多少不思議に感じましたが、「そういう時代なのだな」と思いました。"],
 cream:["思いついた短いフレーズを集めて、それに余計な解説をつけた書下ろしエッセィです。珍しく常識的な物言いになっているので、「らしくなさ」が多少は出せて良かったかな、と思います。できれば、もう少し「らしくない」方が良かったかもしれません。英題を直訳すると「つぶよりなつぶやき」になります。\nつぼやき の テリーヌ","初めての文庫書下ろしです。大和書房から出ている「100の講義」シリーズと同じ作り方ですが、今後は少しずつ棲み分けていくことになるでしょう。たぶん、あまり役に立たないことが、こちらの「クリーム」シリーズの主力になるのではないかと思います。今のところ、講談社の２冊は、書いた順番のとおり並んでいる、というのが特徴。来年も出すことが決定しています。\nつぼね の カトリーヌ","文庫書下ろしになって２冊め、シリーズ３冊めです。たいていの本は、発行の半年まえに脱稿しているので、最新の時事ネタは入れにくいのですが、それでも過去のエッセィに比べると「ああ、あのことか」とわかるものが多いと思います。暇な生活になって、ニュースなどをときどき見るからかもしれません。今まであまり経験がなかったことですが、この本は、発行の１週間以上まえに重版が決まりました。こういうのは、「読み違い」というのではないか、と思いますが。\nツ ンドラモンスーン","","シリーズ５作めです。初心にかえったわけではありませんが、比較的順当で大人しいタイトルにしました。今回も、執筆は半年まえでしたので、季節感がずれているかもしれません。半年間読まずに寝かせていただくとちょうど食べ頃かもしれません。今回は、羽海野チカさんに解説をお願いしました。お忙しいのにイラストを描いていただきました。一方、栞のイラストを描くのは、いつも発行の１カ月ほどまえですが、１年でこのときだけロットリングとかケント紙が必要で、部屋中を探しまわることになるのです。","シリーズも６作めになりました。いつもは、タイトルだけさきに考えて、そこからランダムに選んで本文を書いていたのですが、今回は、最初から順番に、タイトルもそのつど思いついて書きました。そのため、少しつながりがある流れになっている反面、突飛なものが表れにくくなっているかもしれません。いろいろ書き方を模索して、反響も見て、今後のスタイルに活かしたいと考えています。今回の解説は、吉本ばななさんで、なんと３年連載のお約束です。ということは、少なくともあと２回はこのシリーズが続くことになりますね。栞もいつもどおり描きました。","シリーズ７作め。よく続くものだ、と感心します。エッセィで一番長いシリーズか、と一瞬考えましたが、『MORI LOG ACADEMY』がありました。それを超えるためには、あと７作も出さないといけません（気を引き締めているわけではなく）。最初の頃に比べて、少しずつ自然体になってきたとは感じます。どうも、その方が受けが良いみたいです。あまりシャープなことを書くと、木枯らしに対してコートを握り締め身構えられるからなのかな、とも考察しているところです。吉本ばななさんの解説がありますので、少なくとも来年は出ます（森博嗣が生きていれば）。","シリーズ８作めです。いろいろ各方面で縮小傾向にあるなか、これは続いています。このシリーズは、オリジナル栞のためにイラストを描く仕事が余分にあって、これが大きな負担となっていますから、これを描きたくなくなったら、あるいは、森家のケント紙のストックがなくなったら、シリーズが終わりになる、と危ぶんでもらってもかまいません。ということは、次がまだ出そうですね。","シリーズ９作めです。今年前半、遊び呆けて仕事をしなかったので、いつもより執筆が遅くなり、結果としてウィルス騒動について書くことができました。このまま、新しい生活様式が定着することを密かに期待しています。そのほかには、いつもどおりではないかな、と思います。","シリーズ10作めです。長く続きました。まだやめるつもりはありませんけれど、シリーズとしては全10巻とした方が一般受けするかな、とも考えます。悩むほど真剣には考えておりません。電子書籍の方が売れているので、いつまで見開き２ページなのか、という小さな問題は、最初から抱えていました。","いよいよ11作めとなりました。シリーズといっても、なにかが続いているわけではなく、また中身の100編も、内容はばらばらですから、もしかしたら将来、内容別にまとめられて、別のタイトルの本になるかもしれません（嘘です）。今回は、数学パズルが付属しています（解説で）。","12作めです。相変わらずの内容で、完全にマンネリとなりましたが、古い内容は忘れて、どんどん記憶を上書きしていただければ幸いです。","ついに、13作めとなりました。マンネリを避けるために、今回は少しだけギアを上げてみました。そろそろ潮時かな、とも思いつつ。","14作めです。少々抽象度を上げて書きました。逃げ切りたい感じが出ているかもしれません。\nUncharted Unknown\n月刊雑誌「CIRCUS」に連載を始めましたが、途中で休刊となり、その４年後に、同じ出版社からのウェヴ連載依頼を受け、隔週で発表したエッセィを取りまとめたものです（全48編を収録。未発表の８編も含む）。雑誌の読者が若者であることから、内容的にも、その世代に向けたものになっています。いつものことですが、抽象的な内容なので、読まれる方は、それぞれご自分の環境に合わせて展開していただく必要がある、と思います。\nThinking in Calm Life\n「道なき未知」と同じサイトで、隔週のウェブ連載をしたエッセィ（36編）に、書下ろし（４編）を加えた内容です。若者が年寄りになることを見越して、今回は若者向けというよりは、年寄り向けになっているかもしれません。庭園内や室内で撮影した写真が40枚掲載されていますし、単行本のカバーの写真も、デザイナの指示どおり庭園内で撮影したものです。\nDaily Flowchart\n「静かに生きて考える」に続いて、ウェブ連載したエッセィ（35編）に、書下ろし（５編）を加えた内容です。特にテーマというものはありませんし、社会に対して苦言を述べているものでもありません。前回と同じく、身近で撮影した写真が40枚掲載されています。\n森博嗣の ミステリィ 工作室\nMORI Hiroshi's Mystery Workshop\n小説ではありません（って、タイトル見たらわかるか）。エッセィ集です。このＨＰで現在読めるエッセィの他にも書下ろし文章が沢山あります。趣味に関すること、小説に関すること。目玉は、「森博嗣が選んだミステリィ100冊」（笑）。いったいどういう規準で選んだのだ、という疑惑のチョイス。さらに、大目玉は、「自作を語る」。これまでに発行された全作品に関する「あとがき」であります。森博嗣に対する愛がなくては決して読めない一冊です。したがって、まだ「騙された！」と思っていない人にのみおすすめします。漫画家の萩尾望都先生との対談あり、旧友の荻野真氏、山田章博氏、そして、ささきすばる氏も友情（？）出演あり。さらに、表紙デザインはコジマケン氏です！\n100人 の 森博嗣\n100 MORI Hiroshies\nＶシリーズ他、最近の作品に対する「あとがき」の書下ろし、その他、方々に発表した文章を集めた、エッセィ集です。カバー＆イラストも自分で描きました（講談社文庫版は、表紙はコジマケン氏）。\n森 には 森 の風が吹く\nMy wind blows in my forest\nシリーズ３冊めになりますが、2003年以降15年間に完結したシリーズ小説（水柿君、百年、四季、スカイ・クロラ、ヴォイド・シェイパ、Ｘ、Ｇ、Ｚ、Ｗ）およびシリーズ外長編14作の「あとがき」を書きました。そのほか、他作家の解説や雑誌等へ寄稿した文章を集めたものです。シリーズはこれで完結となります。\n文庫化に際して、単行本未収録３作の小文が追加されました。\n100 lectures series\n常識 に とらわれない 100 の講義\n100 lectures on the contrary honesty\n大和書房から初めて執筆依頼があり、「つぶやきのクリーム」と同じ手法で同じ数の小文を書きました。文章の順番も、また本のタイトルも、編集者にお任せしてできた本です。この種のものは、これからも出し続けていった方が良いかもしれない、と少し考えています。ようやく最近になって、広く素直に読まれるようになったからです。これまでは、単に小説の読者が手に取っていたわけですが、エッセィだけの読者が少しずつ増えてきたように感じます。\n文庫には、あとがきを加筆しました。\n「思考」 を 育てる 100 の講義\n100 lectures for fostering thought\n前著の売れ行きが好調だったので、１年後にまた出すことになりました。作り方はまったく同じです。並びを編集者にお任せしたのも同様です。タイトルの「100の講義」が共通していますが、まあ、講義というほど堅苦しい内容ではありません。愚痴っぽいものもあり、また提言っぽいものもあり、でもほとんどは単なる観察結果かと。カバーも、前著同様小さいイラストが沢山。今回は内容に沿ったイラストで、少しだけ凝った感じになりました。\n文庫には、あとがきを加筆しました。\n素直 に 生きる 100 の講義\n100 lectures by sober observation\n２冊めがまた好調だったので、３冊めが出ました。３冊出ると「シリーズ」になりますね。編集も凝っていて、デザインも含めて、回を重ねるごとに洗練されてきました。一方、コンテンツは相変わらずです。けっこう実社会の出来事について語られているようにも感じますが、普通の感覚からすれば、ぼんやりとして「何を言っているのかわからない」と受け取られるかもしれません。書いている本人も、何を書いているのだろう、と思うことが多いので、それで正解だと思います。\n文庫には、あとがきを加筆しました。\n本質 を 見通す 100 の講義\n100 lectures to see through essence\n４冊めになります。クリームシリーズも合わせると７冊め。最初からまったく同じ感じで続いていて、こんなに書くとも、書けるとも、また売れるとも、思っていませんでした。読者は「同時性」を期待するようで、しかたなく１割ほどは時事ネタを入れていますが、どちらかというとそちらは本質ではありません。「あったよねぇ」という程度です。抽象性を重視して書いているので、なんとなく同じ話も多いかと思いますが、常にこの本から読む新しい読者がいるためです。\n文庫には、あとがきを加筆しました。\n正直 に 語る 100 の講義\n100 lectures describing in sincerity\n毎年夏に発行してきた「100の講義」シリーズの５冊めで、これで最終巻となります。それにしても、５年もよく続きました。まだ続けても良かったのですが、さすがにマンネリなのではないか、と思い、来年2017年からは、装いも変えて、新しいシリーズを始める予定です。最後はタイトルもそのままズバリ、身も蓋もないものになりました。飾らずに、思ったことを正直にずっと書いてきましたし、たぶん、これからも相も変わらず書いていくことになるでしょう。\n文庫には、あとがきを加筆しました。\nMORI Magazine\n「100の講義」シリーズに代わる、新シリーズです。最初に、「雑誌」みたいな構成でいこうと決めたのですが、具体的には、読者からの質問や相談を交えたり、また時事ネタを入れたりして、フラットなエッセィよりは変化に富んでいるのではないか、その分、読んでいて眠くならないのではないか、と考えたものです。まずは、最初の１冊です。今後、タイトルを変えるのか、このまま引き継ぐのかは現時点では決めていません。\n文庫版には、「文庫化に当たってのあとがき」が追加されました。\nMORI Magazine ２\n第２巻が発行できることになりました。創刊号とだいたい同じです。違っているのは、ショートショートと付録の運勢占いが加わっていることくらいです。\n文庫版には、「文庫化に当たってのあとがき」が追加されました。\nMORI Magazine ３\nおかげさまで、第３巻が発行できました。このシリーズは、コジマケン氏のイラストだけでも元が取れると思います。内容については、第２巻と同じですが、小説は連載だったということがわかります。本誌は、この３巻をもって休刊となります。\nミニチュア 庭園 鉄道\n欠伸軽便鉄道弁天ヶ丘線の昼下がり\nおそらく日本で初めての庭園鉄道の本です。機関車製作部でのレポートを中心に、模型関係の書下ろしエッセィなども掲載。具体的な情報を極力廃し、楽しさだけを抽出した濃縮のデザイン。写真は700枚、フルカラーです。でも、ちょっとだけ小さい。\nミニチュア 庭園 鉄道 ２\n欠伸軽便鉄道弁天ヶ丘線の大躍進\n前書に引き続き、機関車製作部のレポートをダイジェスト。また、書下ろしレポートも掲載。少しシェイプアップしましたが、フルカラーのまま、価格も下がりました。\nミニチュア 庭園 鉄道 ３\n欠伸軽便鉄道弁天ヶ丘線の野望\nもう１冊出ました。これでシリーズ完結です。機関車製作部のレポートをダイジェストに、書下ろしレポートやコラムも。でも、弁天ヶ丘線の工事自体はまだまだ続いています。\n庭園鉄道趣味　鉄道に乗れる庭\nGarden Railway Life\n３冊でやめるつもりでしたが、また出してしまいました。出版社が変わり、本のサイズも大きくなり、中の写真も見やすくなっています（そのかわり値段は上がりました）。非常に趣味的な本ですので、くれぐれもご注意下さい。\n庭煙鉄道趣味　庭蒸気が走る毎日\nSteam in the Garden\nこれで最後になるでしょう。もしも次に本を出す機会が巡ってきても、鉄道名は「Ａ＆Ｂ」ではなくなっているはずです。残念ながら値段が少し高くなってしまいましたが、このマニアックさなので、しかたがないでしょう。\n森博嗣の 浮遊 研究室\nMORI Hiroshi's Floating Laboratory\nWEBダヴィンチに連載している「浮遊研究室」のNo.1〜No.50をそっくり収録して本にしました。コジマケン氏のカバー＆イラストと、御器所千種のクイズの解答、さらにはこの本だけで明かされる秘密情報なども収録。シリーズはまだ続きます。\n森博嗣の 浮遊 研究室 ２ 　未来編\nMORI Hiroshi's Floating Laboratory 2\n同じく「浮遊研究室」のNo.51〜No.80を収録。コジマケン氏のカバー＆イラストと、御器所千種のクイズの解答、そしてスペシャル企画も。まだ続いています。\n森博嗣の 浮遊 研究室 ３ 　宇宙編\nMORI Hiroshi's Floating Laboratory 3\n同じく「浮遊研究室」のNo.81〜No.110を収録。コジマケン氏のカバー＆イラストと、御器所千種のクイズの解答、さらにスペシャル企画もあの手この手で続いています。\n森博嗣の 浮遊 研究室 ４ 　鳳凰編\nMORI Hiroshi's Floating Laboratory 4\n同じく「浮遊研究室」のNo.111〜No.140を収録。コジマケン氏のカバー＆イラストと、御器所千種のクイズの解答、なんとスペシャル企画もマンネリにも負けず続いています。\n森博嗣の 浮遊 研究室 5 　望郷編\nMORI Hiroshi's Floating Laboratory 5\n同じく「浮遊研究室」のNo.141〜No.170を収録。コジマケン氏のカバー＆イラストと、御器所千種のクイズの解答、そしてスペシャル企画もいつもどおり。これで完結です。\nThinking everyday in the forest\n講談社の「じぶん書店　森博嗣堂浮遊書店」内のブログ「店主の雑駁」の2017年７月から2017年12月までを、そのまま収録したものです。毎日欠かさず書きましたので、かなりの文章量になりました。ブログには、毎日写真がありましたが、本書には掲載されていません。\nThinking everyday in the forest 2\n同じく、講談社の「じぶん書店　森博嗣堂浮遊書店」内のブログ「店主の雑駁」の2018年１月から2018年６月までを収録。\nThinking everyday in the forest 3\n同じく、講談社の「じぶん書店　森博嗣堂浮遊書店」内のブログ「店主の雑駁」の2018年７月から2018年12月までを収録。\nThinking everyday in the forest 4\n同じく、講談社の「じぶん書店　森博嗣堂浮遊書店」内のブログ「店主の雑駁」の2019年１月から2019年６月までを収録。\nThinking everyday in the forest 5\n同じく、講談社の「じぶん書店　森博嗣堂浮遊書店」内のブログ「店主の雑駁」の2019年７月から2019年12月までを収録。"],

 [4,'εに誓って','2006/5','バスジャック','中部国際空港行きの高速バスがジャックされ、山吹と加部谷が乗り合わせています。都市とバスに爆弾を仕掛けたという声明が出ます。乗客名簿の団体名「εに誓って」が、前作までの事件と関係するのかが焦点です。',[['山吹早月','人質'],['加部谷恵美','人質'],['西之園萌絵','見守る']],''],
 [5,'λに歯がない','2006/9','研究所+密室','完全に施錠されたT研究所で、4人の銃殺死体が見つかります。全員のポケットに「λに歯がない」と書かれたカードがあり、4人とも死後に歯を抜かれていました。',[['西之園萌絵','過去の記憶を取り戻す'],['T研究所の被害者4人','銃殺される']],'事件に迫る中で、萌絵は欠け落ちていた過去の大切な記憶を取り戻します。'],
 [6,'ηなのに夢のよう','2007/1','転換点','地上12メートルの松の枝で首吊り死体が見つかり、「ηなのに夢のよう」というメッセージが残されます。同様の自殺が各地で相次ぎます。カバーに「ターニングポイント」と書かれた巻です。',[['西之園萌絵','事故の真相を知らされる'],['雨宮純','この巻から登場']],'萌絵は、両親を失った10年前の飛行機事故の原因を知らされます。ここから一連のギリシャ文字の事件と、真賀田四季の関連が焦点になります。'],
 [7,'目薬αで殺菌します','2008/9','連続毒物','関西で、劇物の入った目薬が発見されます。その名には「α」の文字がありました。同じ頃、加部谷が発見した変死体が握っていた目薬も「α」でした。探偵・赤柳が調査を始め、事件の背後にはまた謎のプロジェクトがありそうです。',[['加部谷恵美','変死体を発見する'],['赤柳初朗','探偵・調査する']],''],
 [8,'ジグβは神ですか','2012/11','宗教団体','加部谷たちが訪れたパーク「美之里」で事件が起こります。前作から4年が経ち、作中でも同じだけ時間が流れています。',[['加部谷恵美','社会人'],['雨宮純',''],['山吹早月','助教授'],['海月及介','W大へ'],['西之園萌絵','准教授'],['瀬在丸紅子','V'],['椙田泰男','V/X']],'棺に入った女性の遺体が見つかり、「β」と名乗る教祖が登場します。真賀田四季の未来像が語られ、シリーズの転換点になります。犀川は登場しません。'],
 [9,'キウイγは時計仕掛け','2013/11','学会+脅迫','建築学会のため伊豆の大学を訪れた加部谷たちが、萌絵と再会します。会場に、プルトップが刺さったキウイフルーツの入った不気味な宅配便が届きます。',[['加部谷恵美','学会発表'],['山吹早月','共同発表'],['国枝桃子','同行'],['西之園萌絵','再会'],['犀川創平','登場'],['島田文子','この巻から登場']],''],
 [10,'χの悲劇','2016/5','トラム密室','香港のトラムで密室殺人が起こります。島田文子が主人公で、後期三部作の開幕です。',[['島田文子','主人公'],['遠田長通','質問をする男']],'島田は遠田から、真賀田研究所時代の飛行機事故について質問されます。その日のトラムの殺人で、死者の手に「χ」が残され、彼女は警察から交換条件を持ちかけられます。前作の面々が総出演した理由も分かります。'],
 [11,'ψの悲劇','2018/5','失踪+屋敷','老博士・八田洋久が遺書のような手紙を残して失踪します。1年後、縁のある人々が八田家に集まり、実験室で小説「ψの悲劇」を発見します。',[['島田文子','メインの一人'],['八田洋久','失踪した博士']],'ノートには「真賀田博士への返答」というメモがあり、その夜、八田家で死者が出ます。読者レビューでは、人工知能やクローン、別人格の成長がテーマだと言われています。'],
 [12,'ω城の惨劇','2025/10(文庫)','最終巻','もともとGシリーズの最終巻として構想され、シリーズ外作品として発表された作品の文庫化です。副題は「SAIKAWA Sohei\'s Last Case」です。',[['犀川創平','副題の人物']],'']]},
w:{name:'W シリーズ',c:'--w',cl:'--wl',
 intro:'ハギリ博士が、護衛の情報局員と世界の古いスーパ・コンピュータなどを訪ねます。上の帯は、巻ごとの舞台の移動です。',
 vols:[
 [1,'彼女は一人で歩くのか？','2015/10','日本','ハギリは何者かに命を狙われます。保護に来たウグイは、ウォーカロンと人間を識別する彼の研究成果が理由ではないかと言います。',[['ハギリ','主人公'],['ウグイ','護衛']],''],
 [2,'魔法の色を知っているか？','2016/1','チベット','ハギリは人工生体技術のシンポジウムに出席するため、護衛のウグイとアネバネとともに、隔離された特別居住区ナクチュを訪れます。そこで今も人間の子供が生まれていることを知ります。',[['ハギリ',''],['ウグイ','護衛(読者レビューでは「式部」名義)'],['アネバネ','護衛(この巻から)'],['ヴォッシュ','偶然出会う']],'第1作の「魔法」が効いた理由が分かります。読者レビューによれば、ハギリはクーデターに巻き込まれ、その中で偶然ヴォッシュ博士に遭遇します。'],
 [3,'風は青海を渡るのか？','2016/6','チベット','子供が生まれ続けるナクチュを、子供たちの脳波測定のためにハギリが再訪します。ハギリは、子供が生まれる理由についてある仮説を立てています。ウォーカロン・メーカを訪ね、遺跡のような場所にも行きます。',[['ハギリ','仮説を立てる'],['ウグイ','護衛'],['アネバネ','護衛'],['ナクチュの子供たち','脳波を測られる']],''],
 [4,'デボラ、眠っているのか？','2016/10','フランス','フランス西海岸の古い修道院で、生殖可能な一族とスーパ・コンピュータが発見されます。施設の構造はナクチュのものと相似で、ヴォッシュ博士が調査に参加してハギリを呼び寄せます。一方、ナクチュの頭脳が再起動してネットワークの再構築が始まり、トランスファの存在が明らかになります。',[['ハギリ',''],['ウグイ','護衛'],['ヴォッシュ','調査に参加'],['デボラ','トランスファ'],['ベルベット','スーパ・コンピュータ(フランス)'],['ナクチュの頭脳','再起動する']],'この巻でキガタ・サリノ(少女型ウォーカロン)が、情報局の研究所を襲撃します。'],
 [5,'私たちは生きているのか？','2017/2','アフリカ南端','フランスの博覧会から脱走したウォーカロンたちが、「富の谷」に潜んでいるという情報を得ます。「行ったが最後、誰も戻ってこない」と言われ、警察も立ち入らない閉ざされた場所です。ハギリはウグイ、アネバネとアフリカ南端を訪れ、巨大な岩を穿った地下都市で、新しい生のあり方を体験します。',[['ハギリ',''],['ウグイ','護衛'],['アネバネ','護衛'],['村長','唯一の人間(読者レビュー)'],['デボラ','トランスファ']],'読者レビューによれば、舞台は洞窟に暮らすウォーカロンだけの村で、治外法権です。博士の気まぐれで一同は危機に見舞われます。'],
 [6,'青白く輝く月を見たか？','2017/6','北極','北極に潜む古いスーパ・コンピュータとコンタクトを取るため、ハギリとウグイが出かけます。',[['ハギリ',''],['ウグイ','護衛(この巻まで)'],['オーロラ','人工知能(北極海底)']],''],
 [7,'ペガサスの解は虚栄か？','2017/10','インド','インドの富豪の邸宅が舞台で、シリーズで最もミステリィらしい巻です。護衛がキガタ・サリノに替わります。',[['ハギリ',''],['キガタ・サリノ','護衛(この巻から)'],['ペガサス','人工知能(日本)']],'ウグイは昇進して、この巻から現場を離れます。'],
 [8,'血か、死か、無か？','2018/2','エジプト→遠方','イマンは「人間を殺した最初の人工知能」と呼ばれる軍事用AIで、エジプトの遺跡の地下深くに設置されています。デボラらの対立勢力と通信した形跡があり、その解析に協力するためハギリが赴きます。一方、蘇生に成功したナクチュの冷凍遺体が行方不明になり、意識の戻らない「彼」が誘拐されます。',[['ハギリ',''],['キガタ','護衛'],['アネバネ','護衛'],['ウグイ',''],['イマン','軍事用AI'],['デボラ','対立勢力が絡む'],['「彼」','蘇生した冷凍遺体']],''],
 [9,'天空の矢はどこへ？','2018/6','日本','ウォーカロン・メーカのイシカワで、重役たちを乗せた飛行機が行方不明になります。同時に、九州のイシカワ工場が武装勢力に占拠されます。誰が何のために仕組んだのかが謎です。',[['ハギリ',''],['キガタ','護衛'],['アネバネ','護衛'],['ウグイ',''],['オーロラ','人工知能(読者レビュー)']],'読者レビューによれば、前作に続いて百年シリーズとの「答え合わせ」の回で、久慈昌山博士の関わりや、真賀田四季のレゴが語られます。'],
 [10,'人間のように泣いたのか？','2018/10','日本(国際会議)','最終作です。国際会議が開かれる会場で事件が起こります。ハギリとウグイがずっと一緒にいます。',[['ハギリ',''],['ウグイ','']],'']]},
ww:{name:'WW シリーズ',c:'--ww',cl:'--wwl',
 intro:'Wシリーズの続編です。主人公はドイツで暮らす楽器職人のグアトです。第4巻以降は、作者公式サイト(浮遊工作室)のコメントに沿った紹介だけを載せています。登場人物は書いていません。',
 vols:[
 [1,'それでもデミアンは一人なのか？','2019/6','ドイツ','楽器職人のグアトを、金髪碧眼で日本刀を背負った男が訪ねてきます。彼は軍事用に開発された特殊ウォーカロンのデミアンで、ロイディというロボットを探していると言います。',[['グアト','楽器職人'],['ロジ','同居する技師'],['デミアン','特殊ウォーカロン'],['ロイディ','探されている'],['ドイツ情報局','デミアンを追う']],''],
 [2,'神はいつ問われるのか？','2019/10','仮想空間','仮想空間「アリス・ワールド」でシステムダウンが起こり、強制ログアウトされた利用者に、自殺や体調不良が出て社会問題になります。AIとの対話者に選ばれたグアトは、ロジと仮想空間へ向かいます。',[['グアト','対話者'],['ロジ','パートナ'],['アリス','熊のぬいぐるみの少女']],''],
 [3,'キャサリンはどのように子供を産んだのか？','2020/2','研究所の無菌ドーム','国家反逆罪の被疑者キャサリン・クーパ博士と、彼女を訪ねていた検事局の八人が、忽然と姿を消します。博士は無菌ドームから出られず、研究所は人工知能による完璧なセキュリティ下でした。グアトは、博士がドーム内で出産し、母子だけで暮らしていたという情報を得ます。',[['グアト','謎を探る'],['ロジ',''],['キャサリン・クーパ','失踪した博士'],['検事局の八人','一緒に失踪'],['博士の子供','出産したとされる'],['ミチル','読者レビューより'],['ロイディ','読者レビューより'],['パティ','読者レビューより']],'読者レビューには、『すべてがFになる』を踏襲するような展開だという感想があります。また、ミチル、ロイディ、パティが「何かありそう」と受け取られています。結末までは確認できていません。'],
 [4,'幽霊を創出したのは誰か？','2020/6','幽霊騒動','幽霊騒動に巻き込まれる主人公たちを描きます。生命や現実といった概念がシフトしている時代に、幽霊とはどんな存在になるのか、がテーマだと作者は書いています。誰が創出したのかについては、「もちろん人間以外にありません」とのことです。',[],''],
 [5,'君たちは絶滅危惧種なのか？','2021/4','絶滅危惧種','絶滅危惧種の動物をめぐる騒動です。既にクローンが完全に実用化し、絶滅は回避されている世界ですが、種の保存ではなく、そうした動物のコントロールについての研究が密かに行われている、という疑惑が持ち上がります。',[],''],
 [6,'リアルの私はどこにいる？','2022/4','失踪+仮想国家','ヴァーチャルで会った女性からの依頼で、失踪したリアルの彼女の行方を追います。このリアルの彼女は、いつの間にかウォーカロンとすり替えられた疑いがあります。さらに、ヴァーチャル国家の独立騒動に、この失踪事件が関係してきます。',[],''],
 [7,'君が見たのは誰の夢？','2023/4','日本+新ウィルス','舞台は久しぶりに日本です。未知のウィルスが、新しい検査方法によって発見されます。また、前作で話題となった人物の一人が遺体で発見され、グアトたちはキョートの博物館を訪れます。ウォーカロン・メーカが開発した新細胞がついに予約開始となりますが……。',[],''],
 [8,'何故エリーズは語らなかったのか？','2024/4','科学者の研究','ある科学者の研究に関するミステリィです。作者は、やや難解な部分があるかもしれないけれど、諦めずに読んでほしいと書いています。公式サイトでは最新刊として載っています。',[],'']]}

let cur='g', curMode='story';
const $=id=>document.getElementById(id);

function renderCard(v){
 const ac=COMMENTS[cur]&&COMMENTS[cur][v[0]-1];
 if(curMode==='ac'){
  return '<div class="card">'+
   '<div class="head"><div class="num">'+v[0]+'</div><div><h3>'+v[1]+'</h3><small>'+v[2]+'</small></div></div>'+
   (ac?'<div class="ac-box">'+ac+'</div>':'<div class="ac-none">（作者コメント未取得。update_mori_comments.py を実行してください）</div>')+
   '</div>';
 }
 return '<div class="card">'+
  '<div class="head"><div class="num">'+v[0]+'</div><div><h3>'+v[1]+'</h3><small>'+v[2]+'</small></div></div>'+
  '<span class="chip">'+v[3]+'</span>'+
  '<div class="sum">'+v[4]+'</div>'+
  '<div class="lbl">'+(v[5].length?'登場人物':'登場人物は未記入(作者公式サイトのコメントに基づく紹介)')+'</div>'+
  '<div class="who">'+v[5].map(p=>'<div class="p">'+p[0]+(p[1]?'<em>'+p[1]+'</em>':'')+'</div>').join('')+'</div>'+
  (v[6]?'<div class="sp">'+v[6]+'</div>':'')+
  '</div>';
}

function render(){
 const s=S[cur];
 document.documentElement.style.setProperty('--c','var('+s.c+')');
 document.documentElement.style.setProperty('--cl','var('+s.cl+')');
 $('intro').textContent=s.intro;
 [...$('tabs').children].forEach(b=>b.classList.toggle('on',b.dataset.k==cur));
 [...$('modeTabs').children].forEach(b=>b.classList.toggle('on',b.dataset.m==curMode));
 $('spOpt').style.display=curMode==='ac'?'none':'';
 $('path').innerHTML=s.vols.map(v=>{const t=cur=='w'?WPATH[v[0]-1]:v[3];return '<div class="step"><b>'+v[0]+'</b><span>'+t+'</span></div>'}).join('');
 $('list').innerHTML=s.vols.map(v=>renderCard(v)).join('');
}

Object.keys(S).forEach(k=>{
 const b=document.createElement('button');
 b.textContent=S[k].name;b.dataset.k=k;
 b.onclick=()=>{cur=k;render();scrollTo(0,0)};

});

 const b=document.createElement('button');
 b.textContent=label;b.dataset.m=m;
 b.onclick=()=>{curMode=m;render()};

});
$('sp').onchange=e=>document.body.classList.toggle('show',e.target.checked);
