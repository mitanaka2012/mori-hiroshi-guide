<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>森博嗣 各巻ガイド</title>
<style>
:root{--bg:#fafaf7;--fg:#222;--sub:#666;--card:#fff;--line:#ddd;--spoil:#b3261e;
--g:#2f6f4f;--gl:#e1f1e8;--w:#2a5d9f;--wl:#e2ecfa;--ww:#a4572b;--wwl:#fbeadf}
@media(prefers-color-scheme:dark){:root{--bg:#16181a;--fg:#e8e8e4;--sub:#9a9a95;--card:#1f2224;--line:#33383b;--spoil:#ff8a80;
--g:#6fcf9a;--gl:#1f3a2c;--w:#7fb1f0;--wl:#1f3047;--ww:#e8a074;--wwl:#472f20}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.65 -apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
main{max-width:520px;margin:0 auto;padding:14px 12px 50px}
h1{font-size:19px;margin:4px 2px}
.tabs{display:flex;gap:6px;margin:10px 0;position:sticky;top:0;background:var(--bg);padding:6px 0;z-index:5}
.tabs button{flex:1;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:10px;padding:7px 4px;font-size:13px;cursor:pointer}
.tabs button.on{background:var(--c);color:#fff;border-color:var(--c)}
.opt{font-size:13px;color:var(--spoil);margin:2px 2px 8px}
.intro{font-size:13px;color:var(--sub);margin:4px 2px 10px}
.path{display:flex;gap:0;overflow-x:auto;padding:6px 2px 12px;scrollbar-width:thin}
.step{flex:0 0 auto;text-align:center;min-width:64px;position:relative;padding:0 2px}
.step b{display:flex;width:26px;height:26px;margin:0 auto 3px;border-radius:50%;background:var(--c);color:#fff;align-items:center;justify-content:center;font-size:12px;position:relative;z-index:1}
.step:not(:last-child)::after{content:"";position:absolute;top:12px;left:50%;width:100%;height:2px;background:var(--c);opacity:.45}
.step span{font-size:10.5px;color:var(--sub);display:block;line-height:1.3}
.card{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:10px;padding:10px 12px;margin:0 0 12px}
.head{display:flex;gap:10px;align-items:flex-start}
.num{flex:0 0 auto;width:30px;height:30px;border-radius:8px;background:var(--c);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center}
.head h3{margin:0;font-size:15px;line-height:1.35}
.head small{color:var(--sub);font-size:11.5px}
.chip{display:inline-block;font-size:11px;padding:0 8px;border-radius:99px;background:var(--cl);color:var(--c);margin:4px 4px 0 0;border:1px solid var(--c)}
.sum{margin:6px 0 4px;font-size:13.5px}
.who{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.p{font-size:12px;background:var(--cl);border-radius:8px;padding:2px 8px;line-height:1.4}
.p em{display:block;font-style:normal;color:var(--sub);font-size:10.5px}
.lbl{font-size:11px;color:var(--sub);margin-top:8px}
.sp{display:none;margin-top:8px;padding:6px 10px;border:1px dashed var(--spoil);border-radius:8px;font-size:12.5px;color:var(--spoil)}
body.show .sp{display:block}
.foot{font-size:12px;color:var(--sub);margin:16px 2px}
</style>
</head>
<body>
<main>
<h1>森博嗣 各巻ガイド</h1>
<div class="tabs" id="tabs"></div>
<label class="opt"><input type="checkbox" id="sp"> ネタバレを表示する</label>
<div class="intro" id="intro"></div>
<div class="path" id="path"></div>
<div id="list"></div>
<p class="foot">確認できた範囲(講談社の紹介文、作者公式サイト、百科事典、読者レビュー)での整理です。「読者レビューより」とある箇所は、レビュー記事に基づく補足です。資料で分からなかった巻(Gの第10・11作の細部、Wの第6・7・10作の脇役など)は、人物を絞って載せています。WWシリーズの第4〜8巻は、作者公式サイトのコメントに基づく紹介のみです。</p>
</main>
<script>
const S={
g:{name:'G シリーズ',c:'--g',cl:'--gl',
 intro:'加部谷恵美・山吹早月・海月及介を中心に、西之園萌絵ら過去シリーズの人物が集まっていく群像劇です。巻の下の「流れ」は事件の形式です。',
 vols:[
 [1,'φは壊れたね','2004/9','密室殺人','国枝研の山吹・海月・加部谷が新シリーズの中心です。山吹が偶然事件の現場に居合わせ、犯人と密室の手法を考察していきます。各章の冒頭に『論理哲学論考』が引用されます。',[['山吹早月','現場に居合わせる'],['海月及介','考察する'],['加部谷恵美','']],'殺害の動機や背景は、最後までほとんど語られません。'],
 [2,'θは遊んでくれたよ','2005/5','連続殺人','25歳の誕生日にマンションから転落死した男性の額に、「θ」と書かれていました。半月後には手のひらに赤いθが書かれた女性の死体が見つかり、同様の事件が続きます。久しぶりに密室ではありません。',[['西之園萌絵','推理を展開する'],['反町愛','事件を伝える旧友'],['山吹早月','学生三人組'],['海月及介','学生三人組'],['加部谷恵美','学生三人組'],['赤柳初朗','探偵']],''],
 [3,'τになるまで待って','2005/9','館+密室','森に建つ洋館《伽羅離館》は、超能力者・神居静哉の別荘です。赤柳・山吹・加部谷ら7人が訪れた夜、雷雨の中で豪華な晩餐のあと、館の主が密室で殺されます。死ぬ直前に聴いていたラジオドラマが「τになるまで待って」でした。',[['赤柳初朗','探偵'],['山吹早月',''],['加部谷恵美',''],['神居静哉','殺された館の主(超能力者)'],['犀川創平','読者レビューより']],'読者レビューによれば、犀川が過去最速で密室のトリックを解いて帰ります。ただし事件そのものは解決せず、警察任せになり、「τになるまで待って」の意味も分からないまま終わります。'],
 [4,'εに誓って','2006/5','バスジャック','中部国際空港行きの高速バスがジャックされ、山吹と加部谷が乗り合わせています。都市とバスに爆弾を仕掛けたという声明が出ます。乗客名簿の団体名「εに誓って」が、前作までの事件と関係するのかが焦点です。',[['山吹早月','人質'],['加部谷恵美','人質'],['西之園萌絵','見守る']],''],
 [5,'λに歯がない','2006/9','研究所+密室','完全に施錠されたT研究所で、4人の銃殺死体が見つかります。全員のポケットに「λに歯がない」と書かれたカードがあり、4人とも死後に歯を抜かれていました。',[['西之園萌絵','過去の記憶を取り戻す'],['T研究所の被害者4人','銃殺される']],'事件に迫る中で、萌絵は欠け落ちていた過去の大切な記憶を取り戻します。'],
 [6,'ηなのに夢のよう','2007/1','転換点','地上12メートルの松の枝で首吊り死体が見つかり、「ηなのに夢のよう」というメッセージが残されます。同様の自殺が各地で相次ぎます。カバーに「ターニングポイント」と書かれた巻です。',[['西之園萌絵','事故の真相を知らされる'],['雨宮純','この巻から登場']],'萌絵は、両親を失った10年前の飛行機事故の原因を知らされます。ここから一連のギリシャ文字の事件と、真賀田四季の関連が焦点になります。'],
 [7,'目薬αで殺菌します','2008/9','連続毒物','関西で、劇物の入った目薬が発見されます。その名には「α」の文字がありました。同じ頃、加部谷が発見した変死体が握っていた目薬も「α」でした。探偵・赤柳が調査を始め、事件の背後にはまた謎のプロジェクトがありそうです。',[['加部谷恵美','変死体を発見する'],['赤柳初朗','探偵・調査する']],''],
 [8,'ジグβは神ですか','2012/11','宗教団体','加部谷たちが訪れたパーク「美之里」で事件が起こります。前作から4年が経ち、作中でも同じだけ時間が流れています。',[['加部谷恵美','社会人'],['雨宮純',''],['山吹早月','助教授'],['海月及介','W大へ'],['西之園萌絵','准教授'],['瀬在丸紅子','V'],['椙田泰男','V/X']],'棺に入った女性の遺体が見つかり、「β」と名乗る教祖が登場します。真賀田四季の未来像が語られ、シリーズの転換点になります。犀川は登場しません。'],
 [9,'キウイγは時計仕掛け','2013/11','学会+脅迫','建築学会のため伊豆の大学を訪れた加部谷たちが、萌絵と再会します。会場に、プルトップが刺さったキウイフルーツの入った不気味な宅配便が届きます。',[['加部谷恵美','学会発表'],['山吹早月','共同発表'],['国枝桃子','同行'],['西之園萌絵','再会'],['犀川創平','登場'],['島田文子','この巻から登場']],''],
 [10,'χの悲劇','2016/5','トラム密室','香港のトラムで密室殺人が起こります。島田文子が主人公で、後期三部作の開幕です。',[['島田文子','主人公'],['遠田長通','質問をする男']],'島田は遠田から、真賀田研究所時代の飛行機事故について質問されます。その日のトラムの殺人で、死者の手に「χ」が残され、彼女は警察から交換条件を持ちかけられます。前作の面々が総出演した理由も分かります。'],
 [11,'ψの悲劇','2018/5','失踪+屋敷','老博士・八田洋久が遺書のような手紙を残して失踪します。1年後、縁のある人々が八田家に集まり、実験室で小説「ψの悲劇」を発見します。',[['島田文子','メインの一人'],['八田洋久','失踪した博士']],'ノートには「真賀田博士への返答」というメモがあり、その夜、八田家で死者が出ます。読者レビューでは、人工知能やクローン、別人格の成長がテーマだと言われています。'],
 [12,'ω城の惨劇','2025/10(文庫)','最終巻','もともとGシリーズの最終巻として構想され、シリーズ外作品として発表された作品の文庫化です。副題は「SAIKAWA Sohei\'s Last Case」です。',[['犀川創平','副題の人物']],'']]},
w:{name:'W シリーズ',c:'--w',cl:'--wl',
 intro:'ハギリ博士が、護衛の情報局員と世界の古いスーパ・コンピュータなどを訪ねます。上の帯は、巻ごとの舞台の移動です。',
 vols:[
 [1,'彼女は一人で歩くのか？','2015/10','日本','ハギリは何者かに命を狙われます。保護に来たウグイは、ウォーカロンと人間を識別する彼の研究成果が理由ではないかと言います。',[['ハギリ','主人公'],['ウグイ','護衛']],''],
 [2,'魔法の色を知っているか？','2016/1','チベット','ハギリは人工生体技術のシンポジウムに出席するため、護衛のウグイとアネバネとともに、隔離された特別居住区ナクチュを訪れます。そこで今も人間の子供が生まれていることを知ります。',[['ハギリ',''],['ウグイ','護衛(読者レビューでは「式部」名義)'],['アネバネ','護衛(この巻から)'],['ヴォッシュ','偶然出会う']],'第1作の「魔法」が効いた理由が分かります。読者レビューによれば、ハギリはクーデターに巻き込まれ、その中で偶然ヴォッシュ博士に遭遇します。'],
 [3,'風は青海を渡るのか？','2016/6','チベット','子供が生まれ続けるナクチュを、子供たちの脳波測定のためにハギリが再訪します。ハギリは、子供が生まれる理由についてある仮説を立てています。ウォーカロン・メーカを訪ね、遺跡のような場所にも行きます。',[['ハギリ','仮説を立てる'],['ウグイ','護衛'],['アネバネ','護衛'],['ナクチュの子供たち','脳波を測られる']],''],
 [4,'デボラ、眠っているのか？','2016/10','フランス','フランス西海岸の古い修道院で、生殖可能な一族とスーパ・コンピュータが発見されます。施設の構造はナクチュのものと相似で、ヴォッシュ博士が調査に参加してハギリを呼び寄せます。一方、ナクチュの頭脳が再起動してネットワークの再構築が始まり、トランスファの存在が明らかになります。',[['ハギリ',''],['ウグイ','護衛'],['ヴォッシュ','調査に参加'],['デボラ','トランスファ'],['ベルベット','スーパ・コンピュータ(フランス)'],['ナクチュの頭脳','再起動する']],'この巻でキガタ・サリノ(少女型ウォーカロン)が、情報局の研究所を襲撃します。'],
 [5,'私たちは生きているのか？','2017/2','アフリカ南端','フランスの博覧会から脱走したウォーカロンたちが、「富の谷」に潜んでいるという情報を得ます。「行ったが最後、誰も戻ってこない」と言われ、警察も立ち入らない閉ざされた場所です。ハギリはウグイ、アネバネとアフリカ南端を訪れ、巨大な岩を穿った地下都市で、新しい生のあり方を体験します。',[['ハギリ',''],['ウグイ','護衛'],['アネバネ','護衛'],['村長','唯一の人間(読者レビュー)'],['デボラ','トランスファ']],'読者レビューによれば、舞台は洞窟に暮らすウォーカロンだけの村で、治外法権です。博士の気まぐれで一同は危機に見舞われます。'],
 [6,'青白く輝く月を見たか？','2017/6','北極','北極に潜む古いスーパ・コンピュータとコンタクトを取るため、ハギリとウグイが出かけます。',[['ハギリ',''],['ウグイ','護衛(この巻まで)'],['オーロラ','人工知能(北極海底)']],''],
 [7,'ペガサスの解は虚栄か？','2017/10','インド','インドの富豪の邸宅が舞台で、シリーズで最もミステリィらしい巻です。護衛がキガタ・サリノに替わります。',[['ハギリ',''],['キガタ・サリノ','護衛(この巻から)'],['ペガサス','人工知能(日本)']],'ウグイは昇進して、この巻から現場を離れます。'],
 [8,'血か、死か、無か？','2018/2','エジプト→遠方','イマンは「人間を殺した最初の人工知能」と呼ばれる軍事用AIで、エジプトの遺跡の地下深くに設置されています。デボラらの対立勢力と通信した形跡があり、その解析に協力するためハギリが赴きます。一方、蘇生に成功したナクチュの冷凍遺体が行方不明になり、意識の戻らない「彼」が誘拐されます。',[['ハギリ',''],['キガタ','護衛'],['アネバネ','護衛'],['ウグイ',''],['イマン','軍事用AI'],['デボラ','対立勢力が絡む'],['「彼」','蘇生した冷凍遺体']],''],
 [9,'天空の矢はどこへ？','2018/6','日本','ウォーカロン・メーカのイシカワで、重役たちを乗せた飛行機が行方不明になります。同時に、九州のイシカワ工場が武装勢力に占拠されます。誰が何のために仕組んだのかが謎です。',[['ハギリ',''],['キガタ','護衛'],['アネバネ','護衛'],['ウグイ',''],['オーロラ','人工知能(読者レビュー)']],'読者レビューによれば、前作に続いて百年シリーズとの「答え合わせ」の回で、久慈昌山博士の関わりや、真賀田四季のレゴが語られます。'],
 [10,'人間のように泣いたのか？','2018/10','日本(国際会議)','最終作です。国際会議が開かれる会場で事件が起こります。ハギリとウグイがずっと一緒にいます。',[['ハギリ',''],['ウグイ','']],'']]},
ww:{name:'WW シリーズ',c:'--ww',cl:'--wwl',
 intro:'Wシリーズの続編です。主人公はドイツで暮らす楽器職人のグアトです。第4巻以降は、作者公式サイト(浮遊工作室)のコメントに沿った紹介だけを載せています。登場人物は書いていません。',
 vols:[
 [1,'それでもデミアンは一人なのか？','2019/6','ドイツ','楽器職人のグアトを、金髪碧眼で日本刀を背負った男が訪ねてきます。彼は軍事用に開発された特殊ウォーカロンのデミアンで、ロイディというロボットを探していると言います。',[['グアト','楽器職人'],['ロジ','同居する技師'],['デミアン','特殊ウォーカロン'],['ロイディ','探されている'],['ドイツ情報局','デミアンを追う']],''],
 [2,'神はいつ問われるのか？','2019/10','仮想空間','仮想空間「アリス・ワールド」でシステムダウンが起こり、強制ログアウトされた利用者に、自殺や体調不良が出て社会問題になります。AIとの対話者に選ばれたグアトは、ロジと仮想空間へ向かいます。',[['グアト','対話者'],['ロジ','パートナ'],['アリス','熊のぬいぐるみの少女']],''],
 [3,'キャサリンはどのように子供を産んだのか？','2020/2','研究所の無菌ドーム','国家反逆罪の被疑者キャサリン・クーパ博士と、彼女を訪ねていた検事局の八人が、忽然と姿を消します。博士は無菌ドームから出られず、研究所は人工知能による完璧なセキュリティ下でした。グアトは、博士がドーム内で出産し、母子だけで暮らしていたという情報を得ます。',[['グアト','謎を探る'],['ロジ',''],['キャサリン・クーパ','失踪した博士'],['検事局の八人','一緒に失踪'],['博士の子供','出産したとされる'],['ミチル','読者レビューより'],['ロイディ','読者レビューより'],['パティ','読者レビューより']],'読者レビューには、『すべてがFになる』を踏襲するような展開だという感想があります。また、ミチル、ロイディ、パティが「何かありそう」と受け取られています。結末までは確認できていません。'],
 [4,'幽霊を創出したのは誰か？','2020/6','幽霊騒動','幽霊騒動に巻き込まれる主人公たちを描きます。生命や現実といった概念がシフトしている時代に、幽霊とはどんな存在になるのか、がテーマだと作者は書いています。誰が創出したのかについては、「もちろん人間以外にありません」とのことです。',[],''],
 [5,'君たちは絶滅危惧種なのか？','2021/4','絶滅危惧種','絶滅危惧種の動物をめぐる騒動です。既にクローンが完全に実用化し、絶滅は回避されている世界ですが、種の保存ではなく、そうした動物のコントロールについての研究が密かに行われている、という疑惑が持ち上がります。',[],''],
 [6,'リアルの私はどこにいる？','2022/4','失踪+仮想国家','ヴァーチャルで会った女性からの依頼で、失踪したリアルの彼女の行方を追います。このリアルの彼女は、いつの間にかウォーカロンとすり替えられた疑いがあります。さらに、ヴァーチャル国家の独立騒動に、この失踪事件が関係してきます。',[],''],
 [7,'君が見たのは誰の夢？','2023/4','日本+新ウィルス','舞台は久しぶりに日本です。未知のウィルスが、新しい検査方法によって発見されます。また、前作で話題となった人物の一人が遺体で発見され、グアトたちはキョートの博物館を訪れます。ウォーカロン・メーカが開発した新細胞がついに予約開始となりますが……。',[],''],
 [8,'何故エリーズは語らなかったのか？','2024/4','科学者の研究','ある科学者の研究に関するミステリィです。作者は、やや難解な部分があるかもしれないけれど、諦めずに読んでほしいと書いています。公式サイトでは最新刊として載っています。',[],'']]}
};
const WPATH=['日本','チベット','チベット','フランス','アフリカ南端','北極','インド','エジプト','日本','日本'];
let cur='g';
const $=id=>document.getElementById(id);
function render(){
 const s=S[cur];
 document.documentElement.style.setProperty('--c','var('+s.c+')');
 document.documentElement.style.setProperty('--cl','var('+s.cl+')');
 $('intro').textContent=s.intro;
 [...$('tabs').children].forEach(b=>b.classList.toggle('on',b.dataset.k==cur));
 $('path').innerHTML=s.vols.map(v=>{const t=cur=='w'?WPATH[v[0]-1]:v[3];return '<div class="step"><b>'+v[0]+'</b><span>'+t+'</span></div>'}).join('');
 $('list').innerHTML=s.vols.map(v=>'<div class="card"><div class="head"><div class="num">'+v[0]+'</div><div><h3>'+v[1]+'</h3><small>'+v[2]+'</small></div></div>'
  +'<span class="chip">'+v[3]+'</span><div class="sum">'+v[4]+'</div><div class="lbl">'+(v[5].length?'登場人物':'登場人物は未記入(作者公式サイトのコメントに基づく紹介)')+'</div><div class="who">'
  +v[5].map(p=>'<div class="p">'+p[0]+(p[1]?'<em>'+p[1]+'</em>':'')+'</div>').join('')+'</div>'
  +(v[6]?'<div class="sp">'+v[6]+'</div>':'')+'</div>').join('');
}
Object.keys(S).forEach(k=>{const b=document.createElement('button');b.textContent=S[k].name;b.dataset.k=k;b.onclick=()=>{cur=k;render();scrollTo(0,0)};$('tabs').appendChild(b)});
$('sp').onchange=e=>document.body.classList.toggle('show',e.target.checked);
render();
</script>
</body>
